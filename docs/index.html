<!doctype html>
<html lang="zh-Hant">

<title>Learning Den 陪你一起讀書啦</title>

<style>
:root{
  color-scheme:dark;
  --ink:#0f0a1a; --night:#2b2140; --deep:#1d1630; --paper:#f4ecd8; --lilac:#c7b8e8; --dim:#8a7fa8;
  --gold:#ffd166; --coral:#ff8a5c; --mint:#9fe1cb; --plum:#7a3f9e;
  --kid:#3f8f5a; --teen:#2f6fb0; --sage:#7a3f9e;
  --px:'DotGothic16','PingFang TC','Noto Sans TC',monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--px);font-size:15px;-webkit-font-smoothing:none;image-rendering:pixelated}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--night);border-inline:4px solid var(--ink)}
.screen{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.screen>*{flex-shrink:0}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.box{border:3px solid var(--ink);outline:2px solid var(--paper);outline-offset:-6px;padding:14px}
.paper{background:var(--paper);color:var(--night)}
.btn{border:3px solid var(--ink);border-radius:0;padding:10px 12px;background:var(--paper);color:var(--night);text-align:center;box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translate(1px,1px);box-shadow:none}
.btn.gold{background:var(--gold)}.btn.coral{background:var(--coral)}.btn.mint{background:var(--mint)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--dim)}
.small{font-size:12px;color:var(--lilac)}
.lbl{font-size:12px;color:var(--plum);margin:0 0 6px}
h1{font-size:26px;color:var(--gold);text-align:center;margin:10px 0 0;letter-spacing:2px;font-weight:400}
h2{font-size:17px;font-weight:400;margin:0}
.tier{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:3px solid var(--ink);padding:12px;color:var(--paper)}
.tier[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:-7px}
.opt{width:100%;text-align:left}
/* 題目、選項、解析用清楚的字體（像素字留給介面），英文長句才看得清楚 */
.qtext,.opt,.qopt{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',-apple-system,'Segoe UI',Arial,sans-serif!important;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
.qtext{font-size:17px;line-height:1.65!important}.opt,.qopt{font-size:16px}
.opt.right{background:var(--mint)}.opt.wrong{background:var(--coral)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:4px solid var(--ink);background:var(--deep);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;padding:10px 4px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.nav button[aria-current="page"]{color:var(--gold)}
.nav button{position:relative}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--coral);color:var(--night);font-size:11px;min-width:18px;padding:0 4px;border:2px solid var(--ink);line-height:14px;text-align:center}
.flist{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:3px solid var(--ink);background:var(--deep);color:var(--paper);padding:8px 10px}
.frow .grow{flex:1;min-width:0}
.frow .mini{font-size:12px;padding:5px 8px}
.btn.mini{font-size:13px;padding:5px 8px}
.chat{display:flex;flex-direction:column;gap:6px;min-height:200px}
.bub{max-width:80%;padding:8px 10px;border:3px solid var(--ink);line-height:1.5;word-break:break-word;font-size:14px}
.bub.me{align-self:flex-end;background:var(--gold);color:var(--night)}
.bub.them{align-self:flex-start;background:var(--paper);color:var(--night)}
.bub time{display:block;font-size:11px;opacity:.7}
.lock{height:18px;border:3px solid var(--ink);background:var(--deep)}
.lock i{display:block;height:100%;background:var(--coral)}
.cmt{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:2px dashed #3a2f55;font-size:13px}
.cmt:last-child{border-bottom:0}
.cmt .who{color:var(--mint);white-space:nowrap}
.cmt .txt{flex:1;word-break:break-word}
.more{background:none;border:0;color:var(--dim);padding:0 4px}
.menu{display:flex;gap:6px;margin-top:4px}
.menu button{font-size:11px;padding:3px 6px;border:2px solid var(--ink);background:var(--paper);color:var(--night)}
.room{background:#5a3d2b;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;justify-items:center;padding:14px 8px}
.seat{text-align:center;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.seat .desk{width:44px;height:6px;background:#8b5e3c;border:2px solid var(--ink)}
.timer{text-align:center;font-size:52px;color:var(--gold);letter-spacing:3px;font-variant-numeric:tabular-nums;line-height:1}
.prog{height:16px;border:3px solid var(--ink);background:var(--deep)}
.prog i{display:block;height:100%;background:var(--mint);width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);padding:5px 10px;background:var(--deep);color:var(--lilac);font-size:13px}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--night)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{font-size:11px;text-align:center;padding:3px 0;border:2px solid var(--ink);background:var(--night);color:var(--dim);font-variant-numeric:tabular-nums}
.cal .on{background:var(--coral);color:var(--night)}
.cal .today{border-color:var(--gold)}
.cal .wk{border:0;background:none;color:var(--lilac)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.card{background:var(--paper);color:var(--night);border:3px solid var(--gold);padding:8px 4px;text-align:center;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-weight:400;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(15,10,26,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .box{background:var(--night);max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:var(--night);border:3px solid var(--ink);padding:8px 14px;font-size:13px;z-index:20;max-width:90%}
input[type=text]{font-family:inherit;font-size:15px;width:100%;padding:10px;border:3px solid var(--ink);border-radius:0;background:var(--paper);color:var(--night)}
.row{display:flex;gap:8px}.row>*{flex:1}
.demo{font-size:11px;color:var(--dim);text-align:center}
.err{color:var(--coral);font-size:12px;margin:0}
.app.wide{max-width:1000px}
.tscroll{overflow-x:auto;border:3px solid var(--ink);background:var(--deep)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
.tbl th,.tbl td{padding:8px;text-align:left;border-bottom:2px dashed #3a2f55;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th{color:var(--lilac);font-weight:400;position:sticky;top:0;background:var(--deep)}
.tbl td.num,.tbl th.num{text-align:right}
.tstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tstats div{background:var(--deep);border:3px solid var(--ink);padding:10px}
.tstats b{display:block;font-weight:400;font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border:2px solid var(--ink)}
.pill.ok{background:var(--mint);color:var(--night)}.pill.no{background:#3a2f55;color:var(--lilac)}.pill.bad{background:var(--coral);color:var(--night)}
.titem{background:var(--deep);border:3px solid var(--ink);padding:10px;display:flex;flex-direction:column;gap:6px}
.titem .acts{display:flex;gap:6px;flex-wrap:wrap}
.titem .acts button{font-size:12px;padding:5px 10px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sitem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:3px solid var(--ink);background:var(--deep);color:var(--paper);font-size:12px;text-align:center}
.sitem.on{outline:3px solid var(--gold);outline-offset:-6px}
.sitem .price{display:inline-flex;align-items:center;gap:3px;color:var(--gold);font-size:12px}
.swatch{width:30px;height:30px;border:3px solid var(--ink);padding:0}
.swatch[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:1px}
.seat{background:none;border:0;color:inherit;padding:0;cursor:pointer}
.clabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;background:rgba(15,10,26,.78);color:var(--paper);padding:1px 5px;white-space:nowrap;pointer-events:none;border:1px solid var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* ---------- 像素圖 ---------- */
const PAL={P:'#f4a6c6',p:'#8a5cd6',s:'#f2c79b',k:'#1a1026',b:'#3a7bd5',g:'#9aa3b5',r:'#d94f4f',w:'#f4ecd8',y:'#ffd166',o:'#c98a3a',t:'#5dcaa5',G:'#4caf50',B:'#6ab0f3',c:'#ff8a5c'};
const SPR={

 card:['.yyyyyy.','.ywwwwy.','.ywttwy.','.ywttwy.','.ywwwwy.','.ywkkwy.','.ywwwwy.','.yyyyyy.'],

 sun:['y..y..y.','.y.yy.y.','..yyyy..','yyyyyyyy','..yyyy..','.y.yy.y.','y..y..y.','........'],
 tree:['..GGGG..','.GGGGGG.','GGGGGGGG','GGGGGGGG','.GGGGGG.','...oo...','...oo...','..oooo..'],
 star:['...yy...','...yy...','yyyyyyyy','.yyyyyy.','..yyyy..','.yy..yy.','yy....yy','........'],
 owl:['.o....o.','.oooooo.','owwoowwo','owkookwo','.oooooo.','.ooyyoo.','.oooooo.','..y..y..'],
 bunny:['..w..w..','..w..w..','..wPPw..','.wkwwkw.','.wwPPww.','.wwwwww.','..wwww..','..w..w..'],
 penguin:['..kkkk..','.kkkkkk.','.kwkkwk.','.kwyywk.','kkwwwwkk','.kwwwwk.','.kwwwwk.','..y..y..'],
 dino:['.....GGG','....GkGG','....GGGG','G..GGG..','G.GGGGG.','.GGGyyG.','..GGGG..','..G..G..'],
 chat:['........','.BBBBBB.','BBBBBBBB','BwBwBwBB','BBBBBBBB','.BBBBBB.','..BB....','.B......'],

};
function sprite(name,z){const m=SPR[name]||SPR.bento;let r='';m.forEach((row,y)=>[...row].forEach((c,x)=>{if(PAL[c])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`}));return `<svg width="${8*z}" height="${8*z}" viewBox="0 0 8 8" shape-rendering="crispEdges" style="display:block" aria-hidden="true">${r}</svg>`}
/* 看圖題的圖：每個出題的地方都要放，不然只剩 What is this? */
const qPic=(q,z=6)=>q&&q.pic?`<div style="display:flex;justify-content:center"><span data-s="${q.pic}" data-z="${z}"></span></div>`:'';
function paintSprites(root=document){root.querySelectorAll('[data-s]').forEach(e=>{e.innerHTML=sprite(e.dataset.s,+e.dataset.z||4)})}

/* ---------- 等級與題庫 ---------- */
const TIERS={
 kid:{name:'見習魔法師',stage:'國小',color:'var(--kid)',hint:'全民英檢初級風格・看圖、字彙、文法、對話',focus:15,social:'sticker',
  bots:[['打瞌睡的企鵝','kid'],['愛吃布丁的恐龍','kid'],['會唱歌的香菇','kid'],['找不到襪子的章魚','kid'],['翻跟斗的小雞','kid']]},
 teen:{name:'冒險騎士',stage:'國中',color:'var(--teen)',hint:'國一～國三・會考練習',focus:25,social:'short',max:30,
  bots:[['熬夜的香蕉','teen'],['會飛的拖鞋','teen'],['被作業追的馬鈴薯','teen'],['忘記帶筆的河馬','teen'],['超想睡的無尾熊','teen']]},
 sage:{name:'大魔導師',stage:'高中',color:'var(--sage)',hint:'課本、段考、學測、多益',focus:25,social:'full',max:60,
  bots:[['喝第三杯咖啡的貓頭鷹','sage'],['學測倒數的鬆餅','sage'],['背單字的仙人掌','sage'],['迷路的逗號','sage'],['考古題吸塵器','sage']]}
};
const BANK={
 kid:[],
 teen:[],
 sage:[]
};
/* 從解析裡抓單字卡：例如 "memorable (adj.) 難忘的＝unforgettable" → memorable／難忘的 */
function cardOf(ex,ans){
  const m=/^([A-Za-z][A-Za-z '’.\-\/]*?)\s*\(([a-z]+\.?[^)]*)\)\s*(?:\[[^\]]*\]\s*)?(.+)$/.exec(ex||'');
  const cut=t=>t.split(/[＝=；;。]|\s\(/)[0].trim().slice(0,18);
  if(m)return{w:m[1].trim(),zh:cut(m[3])};
  /* 沒有詞性標記："hang out 一起出去" → hang out／一起出去 */
  const n=/^([A-Za-z][^\u4e00-\u9fff（]*?)\s*([\u4e00-\u9fff（].*)$/.exec(ex||'');
  if(n&&n[1].length<=30)return{w:n[1].trim(),zh:cut(n[2])};
  return{w:ans,zh:/[\u4e00-\u9fff]/.test(ex||'')?cut(ex):''};
}
/* 題庫分成 banks/kid.json、teen.json、sage.json，選了等級才下載（高中題庫很大，國小國中生不用載）。
   由 tools/gept-kid.py、tools/jh-bank.py、tools/import-granny.js 產生。 */
const SRCS={},QID={},bankLoading={};
function addBank(tier,data){
  SRCS[tier]={U:data.units,P:data.presets};BANK[tier]=[];
  data.units.forEach(u=>['v','g','c'].forEach(t=>(u[t]||[]).forEach((r,i)=>{
    const c=cardOf(r[3],r[1][r[2]]);
    const q={id:`${u.id}:${t}:${i}`,u:u.id,t,q:r[0],o:r[1],a:r[2],ex:r[3]||'',w:c.w,zh:c.zh,src:u.short,pic:r[4],tag:u.tags&&u.tags[t],tr:tier};
    BANK[tier].push(q);QID[q.id]=q;
  })));
}
function loadBank(tier){
  if(!tier||SRCS[tier])return Promise.resolve(true);
  if(!bankLoading[tier])bankLoading[tier]=fetch(`banks/${tier}.json`).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
    .then(d=>{addBank(tier,d);return true}).catch(e=>{console.warn(e);delete bankLoading[tier];return false});
  return bankLoading[tier];
}
function bankError(){
  $('#nav').hidden=true;
  $('#view').innerHTML=`<h1>LEARNING DEN</h1><div class="box" style="background:var(--deep)"><h2>題庫載不到</h2><p class="small">檢查一下網路，再試一次。</p></div><button class="btn gold" id="retry">重試</button>`;
  $('#retry').onclick=boot;
}
const TAG={v:'單字',g:'文法',c:'克漏字'};
/* 年級大群：讀書房和城市照年級分（班級代碼還是可以自己打，給老師後台、同班排行和公告用） */
const GRADES={kid:['國小'],teen:['國一','國二','國三'],sage:['高一','高二','高三']};
const gradeOK=(tier,g)=>!!(GRADES[tier]&&GRADES[tier].includes(g));
const roomKey=()=>gradeOK(S.tier,S.grade)?'g-'+S.grade:'t-'+S.tier;
/* 自由房：不分年級、不分等級，誰都可以進來一起讀 */
const roomLabel=()=>S.freeRoom?'自由房':gradeOK(S.tier,S.grade)?S.grade+' 讀書房':'公開讀書房・'+T().stage;
const BOT_TALK={

const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>keyOf(new Date());
const dayNum=()=>{const d=new Date();return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/864e5)};
function hash(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
/* 洗牌用：hash 只差最後一個字時結果也只差一點，排序會幾乎不動；再攪拌一次才真的打散 */
function mix(s){let h=hash(s);h^=h>>>16;h=Math.imul(h,0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);h^=h>>>16;return h>>>0}
function streak(){let d=new Date(),n=0;if(!S.days[keyOf(d)])d.setDate(d.getDate()-1);while(S.days[keyOf(d)]){n++;d.setDate(d.getDate()-1)}return n}
/* 曾經最長連續打卡幾天（好友與私訊的解鎖條件，跟資料庫的 best_streak 同一套算法） */

function bestStreak(){let best=0,run=0,prev=null;Object.keys(S.days).sort().forEach(k=>{const d=new Date(k+'T00:00');run=prev&&(d-prev)/864e5===1?run+1:1;prev=d;best=Math.max(best,run)});return best}

function bindScope(sc,after){
  const cur=scope(),{P}=SRCS[S.tier];
  const pi=P.findIndex(p=>p.ids.length===cur.length&&p.ids.every(i=>cur.includes(i)));
  sc.value=!cur.length?'':pi>=0?'p'+pi:cur.length===1?'u'+cur[0]:'';
  sc.onchange=()=>{const v=sc.value;S.scopeTipDone=true;S.scopes[S.tier]=!v?[]:v[0]==='p'?P[+v.slice(1)].ids.slice():[v.slice(1)];save();toast(`範圍：${scopeName()}`);after()};
}
function scopeName(){
  const sc=scope();if(!sc.length)return '全部題庫';const {U,P}=SRCS[S.tier];
  const hit=P.find(x=>x.ids.length===sc.length&&x.ids.every(i=>sc.includes(i)));
  if(hit)return hit.name;const u=U.find(x=>x.id===sc[0]);return sc.length===1&&u?u.name:sc.length+' 個單元';
}

function avatarGrid(outfit){
  const hat=ITEM[outfit.hat]||ITEM.hat_none,top=ITEM[outfit.top]||ITEM.top_blue,acc=ITEM[outfit.acc];
  const g=[...HAT[hat.hat||'hair'],'..ssss..','..ksks..','..ssss..','.cccccc.','..n..n..'];
  const side=HATSIDE[hat.hat];if(side)Object.entries(side).forEach(([row,pat])=>{g[row]=[...g[row]].map((ch,i)=>pat[i]!=='.'&&ch==='.'?pat[i]:ch).join('')});
  if(acc&&ACC[acc.acc])Object.entries(ACC[acc.acc]).forEach(([row,pat])=>{g[row]=[...g[row]].map((ch,i)=>pat[i]!=='.'?pat[i]:ch).join('')});
  const hair=ITEM[outfit.hair]||ITEM.hair_brown,skin=ITEM[outfit.skin]||ITEM.skin_1;
  return{g,pal:{...RPAL,h:(hat.c||['#8a5cd6'])[0],c:top.c[0],o:hair.c[0],s:skin.c[0]}};
}
function gridRects(g,x,y,pal){let r='';g.forEach((row,yy)=>[...row].forEach((ch,xx)=>{const col=pal[ch];if(col&&ch!=='.')r+=`<rect x="${x+xx}" y="${y+yy}" width="1" height="1" fill="${col}"/>`}));return r}
function avatarSVG(outfit,z){const {g,pal}=avatarGrid(outfit);return `<svg width="${8*z}" height="${8*z}" viewBox="0 0 8 8" shape-rendering="crispEdges" style="display:block" aria-hidden="true">${gridRects(g,0,0,pal)}</svg>`}
function itemRects(id,x,y){const it=ITEM[id];if(!it||!it.g)return '';const c=it.c||[];return gridRects(SHAPE[it.g],x,y,{...RPAL,'1':c[0],'2':c[1]})}
/* 房間：64×48 像素 */
function roomSVG(look,outfit,label){
  const R=look.room,wall=ITEM[R.wall],floor=ITEM[R.floor];let r='';
  r+=`<rect x="0" y="0" width="64" height="32" fill="${wall.c[0]}"/>`;
  if(wall.aurora){const ac=['#5dcaa5','#8a5cd6','#9fe1cb'];for(let x=0;x<64;x++){const y0=6+Math.round(Math.sin(x/6)*3);ac.forEach((c,k)=>r+=`<rect x="${x}" y="${y0+k*3}" width="1" height="3" fill="${c}" opacity=".7"/>`)}for(let i=0;i<14;i++)r+=`<rect x="${(i*23+5)%64}" y="${(i*11+2)%28}" width="1" height="1" fill="#f4ecd8"/>`}
  else if(wall.books){const bc=['#d94f4f','#3a7bd5','#ffd166','#5dcaa5','#f4a6c6','#f4ecd8'];for(let y=2;y<30;y+=9){r+=`<rect x="0" y="${y+7}" width="64" height="1" fill="${wall.c[1]}"/>`;for(let x=1;x<63;x+=3)r+=`<rect x="${x}" y="${y+1+(x*7+y)%3}" width="2" height="${6-(x*7+y)%3}" fill="${bc[(x*5+y)%6]}"/>`}}
  else if(wall.stars){for(let i=0;i<22;i++)r+=`<rect x="${(i*29+7)%64}" y="${(i*17+3)%30}" width="1" height="1" fill="${wall.c[1]}"/>`}
  else for(let x=5;x<64;x+=8)r+=`<rect x="${x}" y="0" width="1" height="32" fill="${wall.c[1]}"/>`;
  r+=`<rect x="0" y="32" width="64" height="16" fill="${floor.c[0]}"/>`;
  if(floor.check){for(let y=32;y<48;y+=4)for(let x=((y/4)%2)*4;x<64;x+=8)r+=`<rect x="${x}" y="${y}" width="4" height="4" fill="${floor.c[1]}"/>`}
  else for(let y=35;y<48;y+=4)r+=`<rect x="0" y="${y}" width="64" height="1" fill="${floor.c[1]}"/>`;
  r+=`<rect x="0" y="31" width="64" height="1" fill="#1a1026" opacity=".35"/>`;
  r+=itemRects(R.window,5,5)+itemRects(R.poster,44,6)+itemRects(R.bed,46,27)+itemRects(R.lamp,40,23)+itemRects(R.plant,28,25);
  r+=itemRects(R.desk,5,27)+itemRects(R.chair,18,26)+itemRects(R.rug,22,40);
  if(outfit){const {g,pal}=avatarGrid(outfit);r+=gridRects(g,12,36,pal)}
  r+=itemRects(R.pet,38,38);
  return `<svg viewBox="0 0 64 48" width="100%" shape-rendering="crispEdges" style="display:block;width:100%;height:auto;aspect-ratio:4/3;flex-shrink:0;image-rendering:pixelated;border:3px solid var(--ink)" role="img" aria-label="${esc(label||'房間')}">${r}</svg>`;
}

/* ---------- 金幣 ----------
   跟資料庫的 coins_earned() 同一套算法；線上版買東西時由資料庫再算一次，改網頁也灌不了金幣。 */
const MILESTONES=[[3,20],[7,50],[15,100],[30,200],[60,400],[100,800]];
/* 活動週（段考週加成）：線上版從資料庫 app_events 讀；單機版用這份。期間內答題、專注、任務金幣 × mult，答題／專注還會隨機掉盲盒券 */
let EVENTS=[{name:'段考預備週加成',start:'2026-10-05',end:'2026-10-11',mult:2,drop:.4}];
const evMult=day=>EVENTS.reduce((m,e)=>day>=e.start&&day<=e.end?Math.max(m,e.mult):m,1);
const curEvent=()=>EVENTS.filter(e=>today()>=e.start&&today()<=e.end).sort((a,b)=>b.mult-a.mult)[0]||null;
async function eventRoll(kind){
  const ev=curEvent();if(!ev)return;
  let won=false;
  if(ONLINE){const r=await cloud.run(()=>sb.rpc('event_roll',{p_kind:kind}));if(!r)return;won=r.won;if(r.tickets!=null)gstate().tickets=r.tickets}
  else{S.evDrops=S.evDrops||{};const k=today()+kind;if(S.evDrops[k]!=null)return;won=Math.random()<ev.drop;S.evDrops[k]=won;if(won)gstate().tickets++}
  save();
  if(won)setTimeout(()=>modal(`<div style="display:flex;justify-content:center"><span data-s="capsule" data-z="8"></span></div><h2 style="text-align:center;color:var(--gold)">${esc(ev.name)}驚喜！</h2>
    <p style="text-align:center;margin:0">${kind==='answer'?'認真答題':'專注讀書'}的獎勵：<b style="color:var(--gold)">盲盒券 1 張</b><br><span class="small">到遊樂場的魔法盲盒免費抽</span></p><button class="btn gold" data-close>太好了</button>`),600);
}
function eventBar(){const e=curEvent();if(!e)return '';const [,m,d]=e.end.split('-');
  return `<div class="box" style="background:linear-gradient(90deg,var(--gold),var(--coral));color:var(--night);padding:8px 12px;outline-color:var(--night);font-size:14px;line-height:1.5"><b>${esc(e.name)} ×${e.mult}</b>・答題、專注、任務金幣翻倍，還會隨機掉盲盒券！（到 ${+m}/${+d}）</div>`}
const FOCUS_CAP=150;
function coinsEarned(){
  let e=50;
  Object.entries(S.answers).forEach(([k,a])=>e+=(10+(a.ok?5:0))*evMult(k.slice(0,10)));
  Object.entries(S.minutes).forEach(([d,m])=>e+=Math.min(m,FOCUS_CAP)*evMult(d));
  const b=bestStreak();MILESTONES.forEach(([d,c])=>{if(b>=d)e+=c});
  return e;
}
const coinsSpent=()=>Object.values(S.owned).reduce((a,p)=>a+p,0);
/* 錢包 = 活動賺的 − 購物 ＋ 流水帳（小遊戲、挑戰、銀行存提） */
const coins=()=>coinsEarned()-coinsSpent()+(S.tx||0);
const owns=id=>ITEM[id]&&((ITEM[id].price===0&&!ITEM[id].cards&&!ITEM[id].gacha&&!ITEM[id].bundle)||S.owned[id]!=null);
/* 打卡後檢查有沒有跨過里程碑 */
function milestoneCheck(before){
  const after=bestStreak(),hit=MILESTONES.filter(([d])=>before<d&&after>=d);
  if(!hit.length)return;
  const top=hit[hit.length-1][0],sum=hit.reduce((a,[,c])=>a+c,0);
  modal(`<div style="display:flex;justify-content:center"><span data-s="fire" data-z="8"></span></div>
    <h2 style="text-align:center">連續打卡 ${top} 天！</h2>
    <p style="text-align:center;margin:0">獲得 <span style="color:var(--gold)">${sum} 金幣</span>${hit.length>1?`<br><span class="small">一次達成 ${hit.map(([d])=>d+' 天').join('、')} 里程碑</span>`:''}${hit.some(([d])=>d===DM_NEED)&&dmTierOk()?'<br><span class="small">好友與私訊解鎖了</span>':''}</p>
    <button class="btn gold" data-close>太棒了</button>`);
}

function equip(it){
  S.look=S.look||{};const L=myLook();

function pickItem(it){
  if(owns(it.id)){equip(it);return}
  if(it.cards){const n=Object.keys(S.cards).length;modal(`<div style="display:flex;justify-content:center">${itemThumb(it)}</div><h2 style="text-align:center">${esc(it.name)}</h2><p style="text-align:center;margin:0;line-height:1.6">收集 ${it.cards} 張單字卡就會自動得到，不能用金幣買。<br>你現在有 ${n} 張，還差 ${Math.max(0,it.cards-n)} 張。</p><button class="btn" data-close>好</button>`);return}

  if(it.bundle){toast(it.bundle==='invite'?`${it.name}：成功邀請 3 位好友就能得到`:it.bundle==='farm'?`${it.name}：用花園收成的作物到交換所換`:it.bundle==='friend'?`${it.name}：和好友的好感度升級才拿得到`:`${it.name}是新手大禮包限定的`);return}

/* 參觀別人的房間：真人從資料庫拿；NPC 用名字決定一間固定的房間 */
async function visitRoom(who,uid,tier){
  let look;
  if(uid){const r=await cloud.look(uid);if(r===undefined)return;look=lookOf(r||{},tier)}
  else{
    const pickSlot=s=>{const l=SHOP.filter(i=>i.slot===s);return l[hash(who+s)%l.length].id};
    const room={};[...ROOM_SLOTS,...PET_SLOTS].forEach(([s])=>room[s]=pickSlot(s));

const SPROUT=[['........','........','........','........','........','........','...dd...','..dddd..'],['........','........','........','........','...G.G..','....G...','....G...','........'],['........','........','..G..G..','...GG...','.G.G..G.','..GGGG..','...GG...','........']];
const ripeAt=pl=>new Date(pl.planted_at).getTime()+CROP[pl.crop].hours*3600e3;
const harvestAmt=pl=>Math.round(CROP[pl.crop].coins*(1+.15*Math.min(pl.waters,3))*(1-.1*Math.min(pl.stolen||0,3)));

function plotSVG(pl){

  if(pl&&pl.crop){const ripe=Date.now()>=ripeAt(pl),prog=(Date.now()-new Date(pl.planted_at).getTime())/(CROP[pl.crop].hours*3600e3);
    if(pl.waters)r+='<rect x="0" y="0" width="10" height="10" fill="#1d2a5c" opacity=".25"/>';
    const g=ripe?CROP[pl.crop].g:SPROUT[prog<.25?0:prog<.6?1:2],cl=CROP[pl.crop].c;
    r+=gridRects(g,1,1,{...RPAL,'1':cl[0],'2':cl[1]});
    for(let i=0;i<pl.waters;i++)r+=`<rect x="${.6+i*1.2}" y=".5" width=".8" height="1" fill="#6ab0f3"/>`;

/* 單機版：自己的花園存在 S.garden；NPC 同學的花園用名字算出來 */
function gardenWaterLocal(){const t=today(),used=((S.garden&&S.garden.used)||{})[t]||0;
  return Math.max(0,1+(S.answers[dkey()]?2:0)+Math.min(3,Math.floor((S.minutes[t]||0)/25))+((S.farm&&S.farm.water&&S.farm.water[t])||0)-used)}
function botGarden(name){const plots=[];for(let i=0;i<6;i++){const h=hash(name+today()+i);if(h%4===0)continue;const c=CROPS[h%CROPS.length];

  plots.push({slot:i,crop:c.id,planted_at:new Date(Date.now()-age).toISOString(),waters:(h>>5)%3,stolen:(h>>7)%2,watered_by_me:!!(S.botWater||{})[today()+name+i],stolen_by_me:!!(S.botSteal||{})[today()+name+i]})}

}

/* ---------- 魔法盲盒 ----------
   機率公開、50 抽保底 SSR、十連保底 SR、每天最多 10 抽、重複的轉成金幣、答完今日一題每天免費抽一次。
   線上版由資料庫 gacha_pull() 抽（用資料庫的亂數），網頁只顯示結果。 */
const RARITY={N:['N','#c7b8e8',60,10],R:['R','#6ab0f3',28,25],SR:['SR','#b48cf0',10,80],SSR:['SSR','#ffd166',2,200]};
const GACHA_ONE=50,GACHA_TEN=450,GACHA_DAY=10,GACHA_PITY=50;
function gstate(){const g=S.gacha=S.gacha||{pity:0,day:'',pulls:0,free:'',tickets:0};g.tickets=g.tickets||0;if(g.day!==today()){g.day=today();g.pulls=0}return g}
const gachaFree=()=>gstate().free!==today()&&!!S.answers[dkey()];
function gachaLocal(n,free,ticket){
  const g=gstate(),out=[];let gotSR=false;
  if(ticket){g.tickets--}else if(free){g.free=today()}else{g.pulls+=n;S.tx=(S.tx||0)-(n===1?GACHA_ONE:GACHA_TEN)}
  for(let i=1;i<=n;i++){
    g.pity++;const r=Math.random();
    let rar=g.pity>=GACHA_PITY?'SSR':r<.02?'SSR':r<.12?'SR':r<.40?'R':'N';
    if(n===10&&i===10&&!gotSR&&(rar==='N'||rar==='R'))rar='SR';
    if(rar==='SR'||rar==='SSR')gotSR=true;if(rar==='SSR')g.pity=0;
    const l=SHOP.filter(x=>x.gacha===rar),it=l[Math.floor(Math.random()*l.length)],dup=S.owned[it.id]!=null,refund=dup?RARITY[rar][3]:0;
    if(dup)S.tx+=refund;else S.owned[it.id]=0;
    out.push({item:it.id,rarity:rar,dup,refund});
  }
  save();return out;
}

function bfs(sx,sy,tx,ty){
  if(!walk(tx,ty))return null;

/* ---------- 遊樂場：恐怖阿嬤（迷你版） ----------

const GRANNY_MAP=['#################','#P..#...#...#..E#','#.#.#.#.#.#.#.#.#','#.#.D.#.#.#.#.#.#','#...#.#.D.#.#...#','#.#.#.#.#.#.D.#.#','#.#.#...#...#.#.#','#G..#...#...#...#','#################'];

function gGranny(lv=1){

  let speed=Math.round((S.tier==='kid'?1100:850)*[1,.8,1,.85][lv-1]),wrong=0,q=null,door=null,over=false,t0=Date.now(),last=Date.now()+2500,bubble=null,loopId=0;
  gameShell(`恐怖阿嬤・第 ${lv} 關`,`<p class="small" style="margin:0">走到門口答對題目才能開門，快逃到綠色出口！答錯阿嬤會變快。${TWO?'這關有兩個阿嬤！':''}${DARK?'停電了，只看得到身邊。':''}</p>
    <canvas id="gcv" width="${GW*TL*2}" height="${GH*TL*2}" style="width:100%;image-rendering:pixelated;border:3px solid var(--ink);display:block"></canvas>
    <div id="gq"></div>
    <div style="display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center" id="gpad">
      <span></span><button class="btn" data-d="0,-1" aria-label="上">▲</button><span></span>
      <button class="btn" data-d="-1,0" aria-label="左">◀</button><span></span><button class="btn" data-d="1,0" aria-label="右">▶</button>
      <span></span><button class="btn" data-d="0,1" aria-label="下">▼</button><span></span></div>`);
  const myCv=$('#gcv'),alive=()=>!over&&$('#gcv')===myCv;
  const walk=(x,y,g)=>M[y]&&M[y][x]&&(M[y][x]==='.'||M[y][x]==='E'&&!g);
  const move=(dx,dy)=>{if(!alive()||q)return;const x=P[0]+dx,y=P[1]+dy;const c=M[y]&&M[y][x];

    const spr=(g,pal,x,y)=>g.forEach((row,yy)=>[...row].forEach((ch,xx)=>{if(pal[ch]&&ch!=='.'){c.fillStyle=pal[ch];c.fillRect(x*TL+2+xx*2,y*TL+2+yy*2,2,2)}}));

    gameOver('tower',lv,win,win?'守住城堡了！':'城堡被攻破了…',`打倒 ${killed} 隻怪物・城堡剩 ${hp} 顆心`,r,score)};

  };
  let prev=performance.now();
  const tick=t=>{if(!alive())return;const dt=Math.min(.05,(t-prev)/1000);prev=t;
    if(spawned<TOTAL&&(t-lastSpawn>(S.tier==='kid'?6000:4500)*[1,.9,.85,.8][lv-1]||!mons.length)&&t-t0>800){spawn();lastSpawn=t;showQ()}

    draw();
    if(hp<=0){end(false);return}
    if(spawned>=TOTAL&&!mons.length){end(true);return}
    loopId=requestAnimationFrame(tick)};
  hud();loopId=requestAnimationFrame(tick);
}

const botMin={};
function roomBots(){dayBots().filter(b=>!S.blocked.includes(b[0])).slice(0,5).forEach((b,i)=>{if(botMin[b[0]]==null)botMin[b[0]]=5+hash(b[0]+today())%70});return dayBots().filter(b=>!S.blocked.includes(b[0])).slice(0,5)}

function freeBots(){const seed=today()+'free'+(S.name||'');

function fmt(s){s=Math.max(0,Math.ceil(s));return s>=3600?`${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`:`${pad(Math.floor(s/60))}:${pad(s%60)}`}

/* ---------- 讀書房聊天室 ----------
   跟讀書房同一間（年級房或自由房），只留最近 24 小時。國小只能送貼圖，國中 30 字、高中 60 字，有不雅字過濾。
   可以檢舉和封鎖；3 個人檢舉就自動藏起來，老師在後台處理。專注中先收起來，免得分心。 */
const RCHAT_MAX={kid:0,teen:30,sage:60};
let rchat={room:'',msgs:[],chan:null,open:false,last:0};
const chatRoom=()=>S.freeRoom?'free':roomKey();
async function openRoomChat(){
  const box=$('#rchat');if(!box)return;
  const room=chatRoom();
  if(rchat.room!==room){
    if(rchat.chan&&ONLINE)sb.removeChannel(rchat.chan);
    rchat={room,msgs:[],chan:null,open:rchat.open,last:rchat.last};
    if(ONLINE){
      const r=await cloud.run(()=>sb.from('room_chat').select('id,user_id,name,tier,body,created_at').eq('room',room).eq('hidden',false).order('id',{ascending:false}).limit(40));
      if(rchat.room!==room)return;
      rchat.msgs=(r||[]).reverse();
      rchat.chan=sb.channel('rchat-'+ME).on('postgres_changes',{event:'*',schema:'public',table:'room_chat'},({eventType,new:m})=>{
        if(!m||m.room!==room||rchat.room!==room)return;
        rchat.msgs=rchat.msgs.filter(x=>x.id!==m.id);
        if(!m.hidden&&eventType!=='DELETE')rchat.msgs.push(m);
        rchat.msgs.sort((a,b)=>a.id-b.id);rchat.msgs=rchat.msgs.slice(-40);drawRoomChat();
      }).subscribe();
    }else{
      /* 單機版：NPC 先聊幾句 */
      const bots=S.freeRoom?freeBots():roomBots(),now=Date.now();
      rchat.msgs=bots.slice(0,3).map((b,i)=>({id:-i-1,user_id:'bot',name:b[0],tier:b[1],body:BOT_TALK[b[1]][hash(b[0]+today())%BOT_TALK[b[1]].length],created_at:new Date(now-(3-i)*240000).toISOString()}));
    }
  }
  drawRoomChat();
}
function drawRoomChat(){
  const box=$('#rchat');if(!box)return;
  const focus=tm.mode==='focus'&&!rchat.open,t=T(),max=RCHAT_MAX[S.tier]||0;
  const list=rchat.msgs.filter(m=>!(m.user_id&&isBlocked(m.user_id))&&!S.blocked.includes(m.name));
  const hhmm=x=>{const d=new Date(x);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
  if(focus){box.innerHTML=`<div class="bar"><span class="small">${esc(roomLabel())} 聊天室・${list.length} 則</span><button class="chip" id="rcopen">打開聊天室</button></div><p class="small" style="margin:0">專注中先收起來，休息時再聊。</p>`;
    $('#rcopen').onclick=()=>{rchat.open=true;drawRoomChat()};return}
  box.innerHTML=`<div class="bar"><span class="small">${esc(roomLabel())} 聊天室</span>${tm.mode==='focus'?'<button class="chip" id="rcclose">收起來</button>':''}</div>
    <div id="rclist" style="display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;padding-right:2px">
      ${list.length?list.map(m=>{const mine=ONLINE?m.user_id===ME:m.user_id==='me';
        return mine?`<div class="bub me">${esc(m.body)}<time>${hhmm(m.created_at)}</time></div>`
          :`<div class="bub them"><b style="font-size:12px;color:var(--plum)">${esc(m.name)}</b><br>${esc(m.body)}<time>${hhmm(m.created_at)}・<button class="more" data-rcr="${m.id}" style="font-size:11px;padding:0;color:var(--plum)">檢舉</button>・<button class="more" data-rcb="${m.id}" style="font-size:11px;padding:0;color:var(--plum)">封鎖</button></time></div>`}).join('')
        :'<p class="small" style="margin:0">還沒有人說話，打個招呼吧！</p>'}
    </div>
    ${max?`<div class="row"><input type="text" id="rcin" maxlength="${max}" placeholder="說點什麼（${max} 字內）" aria-label="聊天訊息"><button class="btn gold" id="rcsend" style="flex:0 0 auto">送出</button></div>`:''}
    <div class="chips">${STICKERS.map(x=>`<button class="chip" data-rcs="${x}">${x}</button>`).join('')}</div>
    <p class="small" style="margin:0">${max?'':'見習魔法師用貼圖聊天。'}看到不舒服的話可以檢舉或封鎖，老師會處理。</p>`;
  const lst=$('#rclist');lst.scrollTop=lst.scrollHeight;

  const send=async txt=>{

    rchat.last=Date.now();
    if(ONLINE){if(await cloud.rpc('send_room_chat',{p_room:rchat.room,p_body:txt})===undefined)return false}
    else{rchat.msgs.push({id:Date.now(),user_id:'me',name:S.name,tier:S.tier,body:txt,created_at:new Date().toISOString()});drawRoomChat();
      const b=pick(S.freeRoom?freeBots():roomBots());if(b&&Math.random()<.6)setTimeout(()=>{if(!$('#rchat'))return;rchat.msgs.push({id:Date.now(),user_id:'bot',name:b[0],tier:b[1],body:pick(BOT_TALK[b[1]]),created_at:new Date().toISOString()});drawRoomChat()},1500+Math.random()*2000)}
    return true};
  if($('#rcsend')){const go=async()=>{if(await send($('#rcin').value))$('#rcin').value=''};$('#rcsend').onclick=go;$('#rcin').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)go()}}
  box.querySelectorAll('[data-rcs]').forEach(b=>b.onclick=()=>send(b.dataset.rcs));
  box.querySelectorAll('[data-rcr]').forEach(b=>b.onclick=async()=>{const id=+b.dataset.rcr;
    if(ONLINE&&id>0){if(await cloud.rpc('report_room_chat',{p_id:id})===undefined)return}toast('已檢舉，老師會收到通知')});
  box.querySelectorAll('[data-rcb]').forEach(b=>b.onclick=()=>{const m=rchat.msgs.find(x=>x.id===+b.dataset.rcb);if(!m)return;
    if(ONLINE&&m.user_id&&m.user_id!=='bot'){S.blocked.push(`u:${m.user_id}:${m.name}`);cloud.block(m.user_id);peers=peers.filter(p=>p.uid!==m.user_id)}else S.blocked.push(m.name);
    save();toast(`已封鎖 ${m.name}`);drawRoomChat()});
}

function startFocus(len){
  tm={...tm,mode:'focus',len:len*60,left:len*60,end:Date.now()+len*60*1000/tm.speed,paused:false};
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>tm.wake=w).catch(()=>{})}catch(e){}
  saveTimer();loop();trackMe();renderRoom();
}
function endTimer(){clearInterval(tm.tick);tm.mode='idle';tm.paused=false;try{tm.wake&&tm.wake.release()}catch(e){}tm.wake=null;saveTimer();trackMe()}
/* 手機切到別的 App 常會重新載入頁面：把計時狀態存起來，回來時接著算 */
function saveTimer(){S.timer=tm.mode==='idle'?null:{mode:tm.mode,end:tm.end,len:tm.len,left:tm.left,paused:!!tm.paused,speed:tm.speed};save()}
function restoreTimer(){
  const t=S.timer;if(!t||tm.mode!=='idle')return;
  Object.assign(tm,t);if(tm.paused)return;
  tm.left=(tm.end-Date.now())*tm.speed/1000;
  if(tm.left>0){loop();return}
  if(tm.mode==='focus')finishFocus();else{tm.mode='idle';saveTimer()}
}
function loop(){clearInterval(tm.tick);tm.tick=setInterval(()=>{
  if(!tm.paused){tm.left=(tm.end-Date.now())*tm.speed/1000;
    Object.keys(botMin).forEach(k=>{if(Math.random()<.02*tm.speed/10)botMin[k]++});
    if(tm.mode==='focus'&&Date.now()-(tm.tracked||0)>60000)trackMe();
    if(tm.left<=0){tm.mode==='focus'?finishFocus():(endTimer(),toast('休息結束，再來一輪？'),curTab==='room'&&renderRoom());return}}
  drawClock()},250)}
function drawClock(){
  if(curTab!=='room')return;const c=$('#clock'),b=$('#bar');if(!c)return;
  if(tm.mode==='idle'){b.style.width='0';return}
  c.textContent=fmt(tm.left);b.style.width=`${Math.min(100,100*(1-tm.left/tm.len))}%`;
  b.style.background=tm.mode==='break'?'var(--gold)':'var(--mint)';
  document.querySelectorAll('[data-bm]').forEach(e=>e.textContent=botMin[e.dataset.bm]);
}
function finishFocus(){
  const mins=Math.round(tm.len/60),m0=S.minutes[today()]||0,before=bestStreak();
  S.minutes[today()]=m0+mins;markDay();cloud.focus(mins);
  const gain=(Math.min(m0+mins,FOCUS_CAP)-Math.min(m0,FOCUS_CAP))*evMult(today());
  const q=pick(cardPool());
  const had=giveCard(q.w,q.zh);cloud.card(q.w);
  tm={...tm,mode:'break',len:300,left:300,end:Date.now()+300*1000/tm.speed,paused:false,quiz:null};
  saveTimer();loop();trackMe();if(curTab==='room')renderRoom();
  modal(`<div style="display:flex;justify-content:center"><span data-s="card" data-z="8"></span></div>
    <h2 style="text-align:center">專注 ${mins} 分鐘完成！</h2>
    <p style="text-align:center;margin:0">獲得單字卡 <span style="color:var(--gold)">${esc(q.w)}</span>${had?`（第 ${S.cards[q.w].n} 張）`:''}<br><span class="small">${esc(q.zh)}</span></p>
    <p style="text-align:center;margin:0;color:var(--gold)">${gain?`+${gain} 金幣${evMult(today())>1?'（加成中）':''}`:`今天的專注金幣已經領滿了`}</p>
    <button class="btn gold" data-close>休息一下</button>`);
  milestoneCheck(before);if(mins>=25)eventRoll('focus');
}

   這些規則資料庫也會再檢查一次（schema.sql 的 dm_ok、are_friends）。 */
let unread={},dmChan=null,chatWith=null,unseenGifts=0;
function drawUnread(){const n=Object.values(unread).reduce((a,b)=>a+b,0)+unseenGifts,b=$('#unread');b.hidden=!n;b.textContent=n>99?'99+':n}
async function listenDM(){
  if(!ONLINE||!ME)return;
  const [u,g]=await Promise.all([cloud.unread(),cloud.gifts()]);unread={};(u||[]).forEach(r=>unread[r.sender]=(unread[r.sender]||0)+1);
  unseenGifts=(g||[]).filter(x=>!x.seen).length;drawUnread();
  if(dmChan)return;
  dmChan=sb.channel('dm-'+ME).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`recipient=eq.${ME}`},({new:m})=>{
    if(isBlocked(m.sender))return;
    if(curTab==='friends'&&chatWith&&chatWith.uid===m.sender){chatWith.msgs.push(m);drawChat();cloud.markRead(m.sender);return}
    unread[m.sender]=(unread[m.sender]||0)+1;drawUnread();toast('收到一則新私訊');
  }).subscribe();
}

/* ---------- 友情好感度 ----------
   私訊（每人每天第一則 +1）、送禮 +3、幫忙澆水 +1（每天最多 2）、偷好友的菜 −2；每對好友每天最多 +6。
   升級雙方都拿獎勵：好朋友 10 點 +20、麻吉 30 點 +50、摯友 60 點 +100＋友情手環、靈魂伴侶 100 點 +200＋愛心翅膀。
   點數由資料庫觸發器自動計算（bump_affinity），網頁只讀 my_affinity()。 */
const AFF_LV=[[0,'點頭之交',0],[10,'好朋友',20],[30,'麻吉',50],[60,'摯友',100],[100,'靈魂伴侶',200]];
let affCache={};
async function loadAffinity(){if(!ONLINE)return affCache;const r=await cloud.run(()=>sb.rpc('my_affinity'));if(r){affCache={};r.forEach(x=>affCache[x.uid]=x)}return affCache}
function affOf(uid){const a=affCache[uid]||{points:0,level:1,today:0};const lv=AFF_LV[a.level-1],next=AFF_LV[a.level];return {...a,name:lv[1],next,pct:next?Math.round(100*(a.points-lv[0])/(next[0]-lv[0])):100}}
const affHearts=lv=>`<span style="color:#f4a6c6;letter-spacing:-1px">${'♥'.repeat(lv)}<span style="color:var(--dim)">${'♥'.repeat(5-lv)}</span></span>`;
function affBadge(uid){const a=affOf(uid);return `<span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:86px"><span class="small">${affHearts(a.level)} ${a.name}</span><span class="lock" style="width:80px;height:6px"><i style="width:${a.pct}%;background:#f4a6c6"></i></span></span>`}
function affHelp(){modal(`<h2>友情好感度</h2><p style="margin:0;line-height:1.8">和好友互動就會增加好感度，升級時<b style="color:var(--gold)">兩個人都有獎勵</b>！</p>
  <div class="flist">${AFF_LV.map(([p,n,c],i)=>`<div class="frow" style="padding:6px 10px"><span>${affHearts(i+1)}</span><span class="grow">${n}</span><span class="small">${p} 點${c?`・各 +${c} 金幣`:''}${i===3?'＋友情手環':i===4?'＋愛心翅膀':''}</span></div>`).join('')}</div>
  <p class="small" style="margin:0;line-height:1.8">・每天第一則私訊 +1<br>・送禮物 +3<br>・幫好友的花園澆水 +1（每天最多 2）<br>・<span style="color:var(--coral)">偷好友的菜 −2</span><br>每對好友每天最多加 6 點，慢慢培養感情吧！</p><button class="btn gold" data-close>知道了</button>`)}
/* 好友頁打開時：好感度升級了就跳通知 */
function affLevelUps(names){
  S.affSeen=S.affSeen||{};const ups=Object.values(affCache).filter(a=>a.level>(S.affSeen[a.uid]||1));
  ups.forEach(a=>S.affSeen[a.uid]=a.level);save();
  if(!ups.length)return;const a=ups[0],lv=AFF_LV[a.level-1];
  modal(`<h2 style="text-align:center;color:#f4a6c6">好感度升級！</h2><p style="text-align:center;margin:0;font-size:22px">${affHearts(a.level)}</p>
    <p style="text-align:center;margin:0;line-height:1.7">你和 <b>${esc(names[a.uid]||'好友')}</b> 變成「${lv[1]}」了！<br><b style="color:var(--gold)">兩個人各 +${lv[2]} 金幣</b>${a.level===4?'<br>還拿到「友情手環」！':a.level===5?'<br>還拿到「愛心翅膀」！':''}</p>

  cloud.refreshWallet&&cloud.refreshWallet();
}

    <input type="text" id="gnote" maxlength="30" placeholder="生日快樂！">

    <div class="row"><button class="btn" data-close>取消</button><button class="btn gold" id="gsend">送出</button></div>`);
  const body=()=>{
    const g=m.querySelector('#gbody');
    if(kind==='coins'){g.innerHTML=`<div class="chips">${[10,30,50,100].map(v=>`<button class="chip" data-ga="${v}" aria-pressed="${v===amt}">${v} 金幣</button>`).join('')}</div><p class="small" style="margin:6px 0 0">你有 ${coins().toLocaleString()} 金幣・每天最多送出 200</p>`;
      g.querySelectorAll('[data-ga]').forEach(b=>b.onclick=()=>{amt=+b.dataset.ga;body()})}
    else{g.innerHTML=`<div class="shop" style="max-height:260px;overflow-y:auto">${SHOP.filter(x=>x.price>0&&buyable(x)).map(x=>`<button class="sitem${item===x.id?' on':''}" data-gi="${x.id}" type="button">${itemThumb(x)}<span>${esc(x.name)}</span><span class="price"><span data-s="coin" data-z="2"></span>${x.price}</span></button>`).join('')}</div>`;
      paintSprites(g);g.querySelectorAll('[data-gi]').forEach(b=>b.onclick=()=>{item=b.dataset.gi;m.querySelector('#gerr').textContent='';body()})}
  };
  m.querySelectorAll('[data-gk]').forEach(b=>b.onclick=()=>{kind=b.dataset.gk;m.querySelectorAll('[data-gk]').forEach(x=>x.setAttribute('aria-pressed',x===b));body()});
  body();
  m.querySelector('#gsend').onclick=async()=>{
    const err=m.querySelector('#gerr'),note=clean(m.querySelector('#gnote').value.trim());
    if(kind==='item'&&!item){err.textContent='先選一個禮物';return}
    const price=kind==='coins'?amt:ITEM[item].price;
    if(price>coins()){err.textContent='金幣不夠';return}
    if(!ONLINE){err.textContent='登入網頁版才能送禮物';return}
    const b=m.querySelector('#gsend');b.disabled=true;b.textContent='送出中…';
    const r=await cloud.rpc('send_gift',{p_to:uid,p_kind:kind,p_amount:kind==='coins'?amt:null,p_item:kind==='item'?item:null,p_note:note});
    if(!r){b.disabled=false;b.textContent='送出';return}
    syncWallet(r.wallet);m.remove();
    const label=kind==='coins'?`${amt} 金幣`:ITEM[item].name;
    toast(`已經送出 ${label}`);
    const msg=await cloud.send(uid,`（送了你一份禮物：${label}）${note?' '+note:''}`.slice(0,200));
    if(msg&&chatWith&&chatWith.uid===uid){chatWith.msgs.push(msg);drawChat()}
  };
}
function drawChat(){
  const box=$('#chat');if(!box||!chatWith)return;
  const tm2=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
  box.innerHTML=chatWith.msgs.length?chatWith.msgs.map((m,i)=>m.sender===ME
    ?`<div class="bub me">${esc(m.body)}<time>${tm2(m.created_at)}</time></div>`
    :`<div class="bub them">${esc(m.body)}<time>${tm2(m.created_at)}・<button class="more" data-rm="${i}" style="font-size:11px;padding:0;color:var(--plum)">檢舉</button></time></div>`).join('')
    :`<p class="small" style="margin:auto;text-align:center">跟 ${esc(chatWith.name)} 打聲招呼吧</p>`;
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const m=chatWith.msgs[+b.dataset.rm];cloud.reportMsg(m.id);b.textContent='已檢舉';b.disabled=true;toast('已檢舉，老師會處理')});
  box.lastElementChild&&box.lastElementChild.scrollIntoView({block:'end'});
}

   ${rc&&rc.length?rc.map(r=>`<div class="titem">
     <div class="bar"><span>${esc(r.author)} <span class="small">${esc(r.room==='free'?'自由房':r.room.replace(/^[gt]-/,''))}・${when(r.created_at)}</span></span><span class="pill bad">${r.reports} 人檢舉</span></div>
     <div style="line-height:1.6">${esc(r.body)}${r.hidden?' <span class="pill no">已隱藏</span>':''}</div>
     <div class="acts"><button class="btn ${r.hidden?'':'coral'}" data-rch="${r.chat_id}" data-v="${r.hidden?0:1}">${r.hidden?'恢復顯示':'隱藏'}</button><button class="btn ghost" data-rcd="${r.chat_id}">沒問題，撤銷檢舉</button><button class="btn ghost" data-mute="${r.author_id}" data-name="${esc(r.author)}">禁言 ${esc(r.author)}</button></div>
   </div>`).join(''):rc?'<p class="small">目前沒有被檢舉的聊天。</p>':'<p class="small">聊天檢舉載不到，請先跑最新的 SQL。</p>'}`;
  $('#tbody').querySelectorAll('[data-rch]').forEach(b=>b.onclick=()=>act('teacher_hide_chat',{p_id:+b.dataset.rch,p_hidden:b.dataset.v==='1'},b.dataset.v==='1'?'已隱藏':'已恢復顯示'));
  $('#tbody').querySelectorAll('[data-rcd]').forEach(b=>b.onclick=()=>act('teacher_dismiss_chat',{p_id:+b.dataset.rcd},'已撤銷檢舉'));
  const act=async(fn,args,msg)=>{if(await cloud.teacher(fn,args)!==undefined){toast(msg);tReports()}};
  $('#tbody').querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>act('teacher_hide_comment',{p_id:+b.dataset.hide,p_hidden:b.dataset.v==='1'},b.dataset.v==='1'?'已隱藏':'已恢復顯示'));
  $('#tbody').querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>act('teacher_dismiss_comment',{p_id:+b.dataset.dc},'已撤銷檢舉'));
  $('#tbody').querySelectorAll('[data-dmm]').forEach(b=>b.onclick=()=>act('teacher_dismiss_message',{p_id:+b.dataset.dmm},'已撤銷檢舉'));
  $('#tbody').querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{const m=modal(`<h2>刪除這則私訊？</h2><p class="small">雙方都看不到了，無法復原。</p><div class="row"><button class="btn" data-close>取消</button><button class="btn coral" id="yes">刪除</button></div>`);m.querySelector('#yes').onclick=()=>{m.remove();act('teacher_delete_message',{p_id:+b.dataset.dm},'已刪除私訊')}});
  $('#tbody').querySelectorAll('[data-mute]').forEach(b=>b.onclick=()=>{const m=modal(`<h2>禁言 ${esc(b.dataset.name)}？</h2><p class="small">禁言後不能留言和傳私訊，可以在「班級總覽」解除。</p><div class="row"><button class="btn" data-close>取消</button><button class="btn coral" id="yes">禁言</button></div>`);m.querySelector('#yes').onclick=()=>{m.remove();act('teacher_set_muted',{p_user:b.dataset.mute,p_muted:true},`已禁言 ${b.dataset.name}`)}});
}
async function tRecent(){
  const rows=await cloud.teacher('teacher_recent_comments',{p_class:S.tcls});
  if(curTab!=='teacher'||!$('#tbody'))return;
  if(!rows){$('#tbody').innerHTML='<p class="small">留言載不到。</p>';return}
  $('#tbody').innerHTML=rows.length?rows.map(c=>`<div class="titem">
     <div class="bar"><span>${esc(c.author)} <span class="small">${tday(c.day)}</span></span>${c.hidden?'<span class="pill no">已隱藏</span>':''}</div>
     <div style="line-height:1.6">${esc(c.body)}</div>
     <div class="acts"><button class="btn ${c.hidden?'':'coral'}" data-hide="${c.comment_id}" data-v="${c.hidden?0:1}">${c.hidden?'恢復顯示':'隱藏'}</button></div>
   </div>`).join('')+'<p class="small">最近 7 天，最多 100 則。</p>':'<p class="small">這個班最近 7 天沒有留言。</p>';
  $('#tbody').querySelectorAll('[data-hide]').forEach(b=>b.onclick=async()=>{if(await cloud.teacher('teacher_hide_comment',{p_id:+b.dataset.hide,p_hidden:b.dataset.v==='1'})!==undefined){toast(b.dataset.v==='1'?'已隱藏':'已恢復顯示');tRecent()}});
}

/* ---------- 我的 ---------- */
function renderMe(){
  const t=T(),d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
  let cal=['日','一','二','三','四','五','六'].map(w=>`<div class="wk">${w}</div>`).join('')+'<div class="wk"></div>'.repeat(first);
  for(let i=1;i<=last;i++){const k=`${y}-${pad(m+1)}-${pad(i)}`;cal+=`<div class="${S.days[k]?'on':''} ${i===d.getDate()?'today':''}">${i}</div>`}
  const cards=Object.entries(S.cards);
  $('#view').innerHTML=`
   <div style="display:flex;gap:12px;align-items:center">${avatarSVG(myLook().outfit,7)}
     <div style="flex:1"><h2>${t.name} ${esc(S.name)}</h2><div class="small">${t.stage}${S.grade&&S.grade!==t.stage?'・'+esc(S.grade):''}${S.cls?'・'+esc(S.cls)+' 班':''}</div></div>${coinChip()}</div>
   <button id="myroom" style="padding:0;border:0;background:none;cursor:pointer" aria-label="布置我的房間">${roomSVG(myLook(),myLook().outfit,'我的房間')}</button>
   <div class="row"><button class="btn gold" id="deco">布置房間</button><button class="btn" id="wear">換裝</button></div>
   <div class="box stats" style="background:var(--deep)">
     <div><b>${streak()}</b><span class="small">連續天數</span></div>
     <div><b>${(weekMinutes()/60).toFixed(1)}</b><span class="small">本週小時</span></div>
     <div><b>${cards.length}</b><span class="small">單字卡</span></div>
   </div>
   <div class="box" style="background:var(--deep)"><p class="small" style="margin:0 0 8px">${m+1} 月打卡</p><div class="cal">${cal}</div></div>
   <div class="box" style="background:var(--deep)"><p class="small" style="margin:0 0 8px">我的單字卡${(()=>{const n=cards.length,nx=SHOP.filter(i=>i.cards&&n<i.cards).sort((a,b)=>a.cards-b.cards)[0];return nx?`・再收集 ${nx.cards-n} 張解鎖「${nx.name}」`:'・獎勵全部解鎖了！'})()}</p>
     ${cards.length?`<div class="cards">${cards.map(([w,c])=>`<div class="card"><div style="font-size:14px">${esc(w)}</div><div style="color:var(--plum)">${esc(c.zh)}</div>${c.n>1?`<div>×${c.n}</div>`:''}</div>`).join('')}</div>`
      :`<p style="margin:0">答對今日一題或完成一次專注，就能收集第一張卡。</p>`}
   </div>
   ${SRCS[S.tier]?`<div class="box" style="background:var(--deep);display:flex;flex-direction:column;gap:8px">
     <label for="scope" class="small">題目範圍（今日一題、多練幾題、小遊戲、雙倍挑戰都用這個）</label>
     ${scopeSelect()}
     <p class="small" style="margin:0">目前：${esc(scopeName())}・${pool().length.toLocaleString()} 題。</p>
   </div>`:''}
   <button class="btn" id="mywrong">錯題本（${wrongs().length} 題）</button>
   <button class="btn" id="mygarden" style="background:#3f8f5a;color:var(--paper)">我的魔法花園</button>
   <div class="row"><button class="btn" id="howto">玩法說明</button><button class="btn" id="mylog">更新紀錄</button></div>
   ${reminderBox()}
   ${TEACHER?'<button class="btn mint" id="tdash">老師後台</button>':''}
   <div class="row"><button class="btn gold" id="share">產生分享圖</button><button class="btn mint" id="meinv">邀請好友拿獎勵</button></div>
   <div class="row"><button class="btn ghost" id="chg">換等級／改名字</button><button class="btn ghost" id="rst">${ONLINE?'登出':'清除資料'}</button></div>
   <p class="demo">Learning Den・免費・非營利教育用途・<a href="https://priscillalearn-ops.github.io/learning-den/about.html" target="_blank" rel="noopener" style="color:var(--lilac)">關於與版權</a></p>
   ${S.blocked.length?`<p class="small">已封鎖：${S.blocked.map(b=>esc(b.startsWith('u:')?b.split(':').slice(2).join(':'):b)).join('、')} <button class="chip" id="unb">全部解除</button></p>`:''}`;
  paintSprites($('#view'));
  $('#share').onclick=share;$('#meinv').onclick=showInvite;bindReminder();checkCardRewards();$('#howto').onclick=showTutorial;$('#mylog').onclick=showChangelog;$('#mygarden').onclick=openMyGarden;$('#mywrong').onclick=()=>renderMistakes();
  $('#myroom').onclick=()=>renderHome();$('#deco').onclick=()=>renderShop('room','me');$('#wear').onclick=()=>renderShop('wear','me');
  if($('#tdash'))$('#tdash').onclick=()=>renderTeacher('class');
  if($('#scope'))bindScope($('#scope'),renderMe);
  $('#chg').onclick=renderOnboard;
  $('#rst').onclick=ONLINE?logout:()=>{const mo=modal(`<h2>清除所有資料？</h2><p class="small">打卡紀錄、單字卡都會消失，無法復原。</p><div class="row"><button class="btn" data-close>取消</button><button class="btn coral" id="yes">清除</button></div>`);mo.querySelector('#yes').onclick=()=>{mo.remove();endTimer();S=fresh();save();renderOnboard()}};
  if($('#unb'))$('#unb').onclick=()=>{S.blocked=[];cloud.unblockAll();save();renderMe()};
}
async function share(){
  try{await document.fonts.load('20px DotGothic16')}catch(e){}
  const W=540,H=960,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  const F=s=>`${s}px DotGothic16, "PingFang TC", sans-serif`;
  x.fillStyle='#2b2140';x.fillRect(0,0,W,H);
  x.fillStyle='#1d1630';for(let i=0;i<40;i++)x.fillRect(hash('s'+i)%W,hash('t'+i)%H,4,4);
  x.strokeStyle='#0f0a1a';x.lineWidth=12;x.strokeRect(6,6,W-12,H-12);x.strokeStyle='#f4ecd8';x.lineWidth=4;x.strokeRect(20,20,W-40,H-40);
  x.textAlign='center';x.fillStyle='#ffd166';x.font=F(44);x.fillText('LEARNING DEN',W/2,110);
  const d=new Date();x.fillStyle='#c7b8e8';x.font=F(24);x.fillText(`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`,W/2,155);
  const m=SPR[S.tier],z=20,ox=W/2-80;m.forEach((row,yy)=>[...row].forEach((ch,xx)=>{if(PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(ox+xx*z,200+yy*z,z,z)}}));
  x.fillStyle='#f4ecd8';x.font=F(34);x.fillText(`${T().name} ${S.name}`,W/2,420);
  const rows=[['連續打卡',`${streak()} 天`],['今天專注',`${S.minutes[today()]||0} 分鐘`],['今日一題',S.answers[dkey()]?(S.answers[dkey()].ok?'答對':'已作答'):'還沒答'],['單字卡',`${Object.keys(S.cards).length} 張`]];
  rows.forEach((r,i)=>{const yy=490+i*90;x.fillStyle='#1d1630';x.fillRect(60,yy,W-120,70);x.textAlign='left';x.fillStyle='#c7b8e8';x.font=F(26);x.fillText(r[0],85,yy+46);x.textAlign='right';x.fillStyle='#ffd166';x.font=F(32);x.fillText(r[1],W-85,yy+47)});
  x.textAlign='center';x.fillStyle='#9fe1cb';x.font=F(24);x.fillText('陪你一起讀書啦',W/2,890);
  const url=c.toDataURL('image/png');
  modal(`<h2>分享圖</h2><img src="${url}" alt="今天的學習成果分享圖" style="width:100%;border:3px solid var(--ink)"><p class="small" style="margin:0">手機長按圖片即可儲存，再貼到 IG 限動。</p><button class="btn" data-close>關閉</button>`);
}

/* ---------- 導覽 ---------- */
let curTab='daily';
function go(tab){
  curTab=tab;joinRoom();$('#app').classList.remove('wide');$('#nav').hidden=false;
  $('#nav').querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  ({city:renderCity,daily:renderDaily,room:renderRoom,games:renderGames,friends:renderFriends,me:renderMe})[tab]();
  $('#view').scrollTop=0;
}
$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
paintSprites($('#nav'));
/* 即時連線省額度：app 放到背景 1 分鐘就斷線，回來再自動連上（Supabase 免費方案同時在線有上限） */
let idleT=null,napping=false;
document.addEventListener('visibilitychange',()=>{
  if(!ONLINE||!ME)return;
  if(document.hidden){clearTimeout(idleT);idleT=setTimeout(()=>{napping=true;leaveRoom();leaveCity();
    if(dmChan){sb.removeChannel(dmChan);dmChan=null}if(rchat.chan){sb.removeChannel(rchat.chan);rchat.chan=null;rchat.room=''}},60000)}
  else{clearTimeout(idleT);if(!napping)return;napping=false;
    joinRoom();listenDM();if(curTab==='city')joinCity();if(curTab==='room')openRoomChat()}
});
boot();
</script>
