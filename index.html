<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#0f0a1a; --night:#2b2140; --deep:#1d1630; --paper:#f4ecd8; --lilac:#c7b8e8; --dim:#8a7fa8;
  --gold:#ffd166; --coral:#ff8a5c; --mint:#9fe1cb; --plum:#7a3f9e;
  --kid:#3f8f5a; --teen:#2f6fb0; --sage:#7a3f9e;
  --px:'DotGothic16','PingFang TC','Noto Sans TC',monospace;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--px);font-size:15px;-webkit-font-smoothing:none;image-rendering:pixelated}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--night);border-inline:4px solid var(--ink)}
.screen{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.screen>*{flex-shrink:0}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.box{border:3px solid var(--ink);outline:2px solid var(--paper);outline-offset:-6px;padding:14px}
.paper{background:var(--paper);color:var(--night)}
.btn{border:3px solid var(--ink);border-radius:0;padding:10px 12px;background:var(--paper);color:var(--night);text-align:center;box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translate(1px,1px);box-shadow:none}
.btn.gold{background:var(--gold)}.btn.coral{background:var(--coral)}.btn.mint{background:var(--mint)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--dim)}
.small{font-size:12px;color:var(--lilac)}
.lbl{font-size:12px;color:var(--plum);margin:0 0 6px}
h1{font-size:26px;color:var(--gold);text-align:center;margin:10px 0 0;letter-spacing:2px;font-weight:400}
h2{font-size:17px;font-weight:400;margin:0}
.tier{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:3px solid var(--ink);padding:12px;color:var(--paper)}
.tier[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:-7px}
.opt{width:100%;text-align:left}
.opt.right{background:var(--mint)}.opt.wrong{background:var(--coral)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:4px solid var(--ink);background:var(--deep);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;padding:10px 4px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.nav button[aria-current="page"]{color:var(--gold)}
.nav button{position:relative}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--coral);color:var(--night);font-size:11px;min-width:18px;padding:0 4px;border:2px solid var(--ink);line-height:14px;text-align:center}
.flist{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:3px solid var(--ink);background:var(--deep);color:var(--paper);padding:8px 10px}
.frow .grow{flex:1;min-width:0}
.frow .mini{font-size:12px;padding:5px 8px}
.chat{display:flex;flex-direction:column;gap:6px;min-height:200px}
.bub{max-width:80%;padding:8px 10px;border:3px solid var(--ink);line-height:1.5;word-break:break-word;font-size:14px}
.bub.me{align-self:flex-end;background:var(--gold);color:var(--night)}
.bub.them{align-self:flex-start;background:var(--paper);color:var(--night)}
.bub time{display:block;font-size:11px;opacity:.7}
.lock{height:18px;border:3px solid var(--ink);background:var(--deep)}
.lock i{display:block;height:100%;background:var(--coral)}
.cmt{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:2px dashed #3a2f55;font-size:13px}
.cmt:last-child{border-bottom:0}
.cmt .who{color:var(--mint);white-space:nowrap}
.cmt .txt{flex:1;word-break:break-word}
.more{background:none;border:0;color:var(--dim);padding:0 4px}
.menu{display:flex;gap:6px;margin-top:4px}
.menu button{font-size:11px;padding:3px 6px;border:2px solid var(--ink);background:var(--paper);color:var(--night)}
.room{background:#5a3d2b;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;justify-items:center;padding:14px 8px}
.seat{text-align:center;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.seat .desk{width:44px;height:6px;background:#8b5e3c;border:2px solid var(--ink)}
.timer{text-align:center;font-size:52px;color:var(--gold);letter-spacing:3px;font-variant-numeric:tabular-nums;line-height:1}
.prog{height:16px;border:3px solid var(--ink);background:var(--deep)}
.prog i{display:block;height:100%;background:var(--mint);width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);padding:5px 10px;background:var(--deep);color:var(--lilac);font-size:13px}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--night)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{font-size:11px;text-align:center;padding:3px 0;border:2px solid var(--ink);background:var(--night);color:var(--dim);font-variant-numeric:tabular-nums}
.cal .on{background:var(--coral);color:var(--night)}
.cal .today{border-color:var(--gold)}
.cal .wk{border:0;background:none;color:var(--lilac)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.card{background:var(--paper);color:var(--night);border:3px solid var(--gold);padding:8px 4px;text-align:center;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-weight:400;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(15,10,26,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .box{background:var(--night);max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:var(--night);border:3px solid var(--ink);padding:8px 14px;font-size:13px;z-index:20;max-width:90%}
input[type=text]{font-family:inherit;font-size:15px;width:100%;padding:10px;border:3px solid var(--ink);border-radius:0;background:var(--paper);color:var(--night)}
.row{display:flex;gap:8px}.row>*{flex:1}
.demo{font-size:11px;color:var(--dim);text-align:center}
.err{color:var(--coral);font-size:12px;margin:0}
.app.wide{max-width:1000px}
.tscroll{overflow-x:auto;border:3px solid var(--ink);background:var(--deep)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
.tbl th,.tbl td{padding:8px;text-align:left;border-bottom:2px dashed #3a2f55;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th{color:var(--lilac);font-weight:400;position:sticky;top:0;background:var(--deep)}
.tbl td.num,.tbl th.num{text-align:right}
.tstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tstats div{background:var(--deep);border:3px solid var(--ink);padding:10px}
.tstats b{display:block;font-weight:400;font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border:2px solid var(--ink)}

.titem{background:var(--deep);border:3px solid var(--ink);padding:10px;display:flex;flex-direction:column;gap:6px}
.titem .acts{display:flex;gap:6px;flex-wrap:wrap}
.titem .acts button{font-size:12px;padding:5px 10px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sitem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:3px solid var(--ink);background:var(--deep);color:var(--paper);font-size:12px;text-align:center}

.swatch[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:1px}
.seat{background:none;border:0;color:inherit;padding:0;cursor:pointer}
.clabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;background:rgba(15,10,26,.78);color:var(--paper);padding:1px 5px;white-space:nowrap;pointer-events:none;border:1px solid var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function sprite(name,z){const m=SPR[name];let r='';m.forEach((row,y)=>[...row].forEach((c,x)=>{if(PAL[c])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`}));return `<svg width="${8*z}" height="${8*z}" viewBox="0 0 8 8" shape-rendering="crispEdges" style="display:block" aria-hidden="true">${r}</svg>`}
/* 看圖題的圖：每個出題的地方都要放，不然只剩 What is this? */

/* ---------- 等級與題庫 ---------- */
const TIERS={
 kid:{name:'見習魔法師',stage:'國小',color:'var(--kid)',hint:'全民英檢初級風格・看圖、字彙、文法、對話',focus:15,social:'sticker',

  bots:[['喝第三杯咖啡的貓頭鷹','sage'],['學測倒數的鬆餅','sage'],['背單字的仙人掌','sage'],['迷路的逗號','sage'],['考古題吸塵器','sage']]}
};

};
/* 從解析裡抓單字卡：例如 "memorable (adj.) 難忘的＝unforgettable" → memorable／難忘的 */
function cardOf(ex,ans){
  const m=/^([A-Za-z][A-Za-z '’.\-\/]*?)\s*\(([a-z]+\.?[^)]*)\)\s*(?:\[[^\]]*\]\s*)?(.+)$/.exec(ex||'');
  const cut=t=>t.split(/[＝=；;。]|\s\(/)[0].trim().slice(0,18);
  if(m)return{w:m[1].trim(),zh:cut(m[3])};
  /* 沒有詞性標記："hang out 一起出去" → hang out／一起出去 */
  const n=/^([A-Za-z][^\u4e00-\u9fff（]*?)\s*([\u4e00-\u9fff（].*)$/.exec(ex||'');
  if(n&&n[1].length<=30)return{w:n[1].trim(),zh:cut(n[2])};
  return{w:ans,zh:/[\u4e00-\u9fff]/.test(ex||'')?cut(ex):''};
}
/* 題庫分成 banks/kid.json、teen.json、sage.json，選了等級才下載（高中題庫很大，國小國中生不用載）。
   由 tools/gept-kid.py、tools/jh-bank.py、tools/import-granny.js 產生。 */
const SRCS={},QID={},bankLoading={};
function addBank(tier,data){
  SRCS[tier]={U:data.units,P:data.presets};BANK[tier]=[];
  data.units.forEach(u=>['v','g','c'].forEach(t=>(u[t]||[]).forEach((r,i)=>{
    const c=cardOf(r[3],r[1][r[2]]);
    const q={id:`${u.id}:${t}:${i}`,u:u.id,t,q:r[0],o:r[1],a:r[2],ex:r[3]||'',w:c.w,zh:c.zh,src:u.short,pic:r[4],tag:u.tags&&u.tags[t],tr:tier};
    BANK[tier].push(q);QID[q.id]=q;
  })));
}
function loadBank(tier){
  if(!tier||SRCS[tier])return Promise.resolve(true);
  if(!bankLoading[tier])bankLoading[tier]=fetch(`banks/${tier}.json`).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
    .then(d=>{addBank(tier,d);return true}).catch(e=>{console.warn(e);delete bankLoading[tier];return false});
  return bankLoading[tier];
}
function bankError(){

  $('#retry').onclick=boot;
}

}

/* ---------- 日期工具 ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>keyOf(new Date());
const dayNum=()=>{const d=new Date();return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/864e5)};
function hash(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function streak(){let d=new Date(),n=0;if(!S.days[keyOf(d)])d.setDate(d.getDate()-1);while(S.days[keyOf(d)]){n++;d.setDate(d.getDate()-1)}return n}
/* 曾經最長連續打卡幾天（好友與私訊的解鎖條件，跟資料庫的 best_streak 同一套算法） */
const DM_NEED=7;
function bestStreak(){let best=0,run=0,prev=null;Object.keys(S.days).sort().forEach(k=>{const d=new Date(k+'T00:00');run=prev&&(d-prev)/864e5===1?run+1:1;prev=d;best=Math.max(best,run)});return best}
const dmTierOk=()=>S.tier!=='kid';
const dmOpen=()=>dmTierOk()&&bestStreak()>=DM_NEED;
function weekMinutes(){let t=0,d=new Date();for(let i=0;i<7;i++){t+=S.minutes[keyOf(d)]||0;d.setDate(d.getDate()-1)}return t}

function pool(){
  const all=BANK[S.tier],sc=scope();if(!sc.length)return all;
  const p=all.filter(q=>sc.includes(q.u));return p.length?p:all;
}

const todayQ=()=>{const p=dailyPool();return p[(dayNum()*7919)%p.length]};

/* 錯題本：答錯就記下來，複習時答對就移除 */
const wrongs=()=>Object.keys(S.wrong).map(id=>QID[id]).filter(q=>q&&q.tr===S.tier);
function addWrong(q){if(!q||!q.id)return;S.wrong[q.id]=(S.wrong[q.id]||0)+1;save();cloud.mistake(q.id,S.wrong[q.id])}

function scopeSelect(){
  const {U,P}=SRCS[S.tier];
  return `<select id="scope" style="font-family:inherit;font-size:14px;padding:8px;border:3px solid var(--ink);border-radius:0;background:var(--paper);color:var(--night);max-width:100%">
    <option value="">全部題庫（${BANK[S.tier].length.toLocaleString()} 題）</option>
    <optgroup label="組合包">${P.map((p,i)=>`<option value="p${i}">${esc(p.name)}</option>`).join('')}</optgroup>
    <optgroup label="單一單元">${U.map(u=>`<option value="u${u.id}">${esc(u.name)}（${u.v.length+u.g.length+u.c.length} 題）</option>`).join('')}</optgroup></select>`;
}
function bindScope(sc,after){
  const cur=scope(),{P}=SRCS[S.tier];
  const pi=P.findIndex(p=>p.ids.length===cur.length&&p.ids.every(i=>cur.includes(i)));
  sc.value=!cur.length?'':pi>=0?'p'+pi:cur.length===1?'u'+cur[0]:'';
  sc.onchange=()=>{const v=sc.value;S.scopes[S.tier]=!v?[]:v[0]==='p'?P[+v.slice(1)].ids.slice():[v.slice(1)];save();toast(`範圍：${scopeName()}`);after()};
}
function scopeName(){
  const sc=scope();if(!sc.length)return '全部題庫';const {U,P}=SRCS[S.tier];
  const hit=P.find(x=>x.ids.length===sc.length&&x.ids.every(i=>sc.includes(i)));
  if(hit)return hit.name;const u=U.find(x=>x.id===sc[0]);return sc.length===1&&u?u.name:sc.length+' 個單元';
}

function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(m);paintSprites(m);m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))m.remove()});return m}
function clean(s){let o=s;BAD.forEach(w=>{o=o.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'＊'.repeat(w.length>3?3:w.length))});return o}

function avatarGrid(outfit){
  const hat=ITEM[outfit.hat]||ITEM.hat_none,top=ITEM[outfit.top]||ITEM.top_blue,acc=ITEM[outfit.acc];
  const g=[...HAT[hat.hat||'hair'],'..ssss..','..ksks..','..ssss..','.cccccc.','..n..n..'];

function gridRects(g,x,y,pal){let r='';g.forEach((row,yy)=>[...row].forEach((ch,xx)=>{const col=pal[ch];if(col&&ch!=='.')r+=`<rect x="${x+xx}" y="${y+yy}" width="1" height="1" fill="${col}"/>`}));return r}
function avatarSVG(outfit,z){const {g,pal}=avatarGrid(outfit);return `<svg width="${8*z}" height="${8*z}" viewBox="0 0 8 8" shape-rendering="crispEdges" style="display:block" aria-hidden="true">${gridRects(g,0,0,pal)}</svg>`}
function itemRects(id,x,y){const it=ITEM[id];if(!it||!it.g)return '';const c=it.c||[];return gridRects(SHAPE[it.g],x,y,{...RPAL,'1':c[0],'2':c[1]})}
/* 房間：64×48 像素 */
function roomSVG(look,outfit,label){
  const R=look.room,wall=ITEM[R.wall],floor=ITEM[R.floor];let r='';
  r+=`<rect x="0" y="0" width="64" height="32" fill="${wall.c[0]}"/>`;
  if(wall.aurora){const ac=['#5dcaa5','#8a5cd6','#9fe1cb'];for(let x=0;x<64;x++){const y0=6+Math.round(Math.sin(x/6)*3);ac.forEach((c,k)=>r+=`<rect x="${x}" y="${y0+k*3}" width="1" height="3" fill="${c}" opacity=".7"/>`)}for(let i=0;i<14;i++)r+=`<rect x="${(i*23+5)%64}" y="${(i*11+2)%28}" width="1" height="1" fill="#f4ecd8"/>`}
  else if(wall.books){const bc=['#d94f4f','#3a7bd5','#ffd166','#5dcaa5','#f4a6c6','#f4ecd8'];for(let y=2;y<30;y+=9){r+=`<rect x="0" y="${y+7}" width="64" height="1" fill="${wall.c[1]}"/>`;for(let x=1;x<63;x+=3)r+=`<rect x="${x}" y="${y+1+(x*7+y)%3}" width="2" height="${6-(x*7+y)%3}" fill="${bc[(x*5+y)%6]}"/>`}}
  else if(wall.stars){for(let i=0;i<22;i++)r+=`<rect x="${(i*29+7)%64}" y="${(i*17+3)%30}" width="1" height="1" fill="${wall.c[1]}"/>`}
  else for(let x=5;x<64;x+=8)r+=`<rect x="${x}" y="0" width="1" height="32" fill="${wall.c[1]}"/>`;
  r+=`<rect x="0" y="32" width="64" height="16" fill="${floor.c[0]}"/>`;
  if(floor.check){for(let y=32;y<48;y+=4)for(let x=((y/4)%2)*4;x<64;x+=8)r+=`<rect x="${x}" y="${y}" width="4" height="4" fill="${floor.c[1]}"/>`}
  else for(let y=35;y<48;y+=4)r+=`<rect x="0" y="${y}" width="64" height="1" fill="${floor.c[1]}"/>`;
  r+=`<rect x="0" y="31" width="64" height="1" fill="#1a1026" opacity=".35"/>`;
  r+=itemRects(R.window,5,5)+itemRects(R.poster,44,6)+itemRects(R.bed,46,27)+itemRects(R.lamp,40,23)+itemRects(R.plant,28,25);
  r+=itemRects(R.desk,5,27)+itemRects(R.chair,18,26)+itemRects(R.rug,22,40);
  if(outfit){const {g,pal}=avatarGrid(outfit);r+=gridRects(g,12,36,pal)}
  r+=itemRects(R.pet,38,38);
  return `<svg viewBox="0 0 64 48" width="100%" shape-rendering="crispEdges" style="display:block;width:100%;height:auto;aspect-ratio:4/3;flex-shrink:0;image-rendering:pixelated;border:3px solid var(--ink)" role="img" aria-label="${esc(label||'房間')}">${r}</svg>`;
}

/* ---------- 金幣 ----------
   跟資料庫的 coins_earned() 同一套算法；線上版買東西時由資料庫再算一次，改網頁也灌不了金幣。 */
const MILESTONES=[[3,20],[7,50],[15,100],[30,200],[60,400],[100,800]];
const FOCUS_CAP=150;
function coinsEarned(){
  let e=50;
  Object.values(S.answers).forEach(a=>e+=10+(a.ok?5:0));
  Object.values(S.minutes).forEach(m=>e+=Math.min(m,FOCUS_CAP));
  const b=bestStreak();MILESTONES.forEach(([d,c])=>{if(b>=d)e+=c});
  return e;
}
const coinsSpent=()=>Object.values(S.owned).reduce((a,p)=>a+p,0);
/* 錢包 = 活動賺的 − 購物 ＋ 流水帳（小遊戲、挑戰、銀行存提） */
const coins=()=>coinsEarned()-coinsSpent()+(S.tx||0);
const owns=id=>ITEM[id]&&((ITEM[id].price===0&&!ITEM[id].cards&&!ITEM[id].gacha&&!ITEM[id].bundle)||S.owned[id]!=null);
/* 打卡後檢查有沒有跨過里程碑 */
function milestoneCheck(before){
  const after=bestStreak(),hit=MILESTONES.filter(([d])=>before<d&&after>=d);
  if(!hit.length)return;
  const top=hit[hit.length-1][0],sum=hit.reduce((a,[,c])=>a+c,0);
  modal(`<div style="display:flex;justify-content:center"><span data-s="fire" data-z="8"></span></div>
    <h2 style="text-align:center">連續打卡 ${top} 天！</h2>
    <p style="text-align:center;margin:0">獲得 <span style="color:var(--gold)">${sum} 金幣</span>${hit.length>1?`<br><span class="small">一次達成 ${hit.map(([d])=>d+' 天').join('、')} 里程碑</span>`:''}${hit.some(([d])=>d===DM_NEED)&&dmTierOk()?'<br><span class="small">好友與私訊解鎖了</span>':''}</p>
    <button class="btn gold" data-close>太棒了</button>`);
}

  const ymd=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`,t=hhmm+'00';

async function claimGame(game,score){
  const g=gday();let r;
  if(ONLINE){const res=await cloud.rpc('claim_game',{p_game:game,p_score:score});if(!res)return 0;r=res.reward;syncWallet(res.wallet)}

/* 單字翻牌：6 組英文／中文 */
function matchPairs(){
  const ok=q=>q.w&&q.zh&&q.w.length<=14&&q.zh.length<=8;
  const seen=new Set(),out=[];
  const mine=Object.entries(S.cards).map(([w,c])=>({w,zh:c.zh})).filter(ok);
  if(mine.length>=6)return mine.sort(()=>Math.random()-.5).slice(0,6);
  const src=[...mine,...pool(),...BANK.kid].filter(ok);
  for(let i=0;i<400&&out.length<6;i++){const q=pick(src.slice(0,Math.max(src.length,1)));if(q&&!seen.has(q.w)){seen.add(q.w);out.push(q)}}
  return out;
}
function gMatch(){
  const pairs=matchPairs();
  const cards=pairs.flatMap((q,i)=>[{i,t:q.w,en:1},{i,t:q.zh}]).sort(()=>Math.random()-.5);
  let open=[],done=new Set(),moves=0,lock=false;
  gameShell('單字翻牌',`<p class="small" style="margin:0">把英文和中文配成一對，翻越少次分數越高。${Object.keys(S.cards).length>=6?'這局用的是你收集的單字卡！':'收集 6 張單字卡後，就會用你自己的卡來玩。'}</p>
    <div id="mboard" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"></div>
    <p class="small" id="mmoves" style="margin:0;text-align:center">翻了 0 次</p>`);
  const draw=()=>{$('#mboard').innerHTML=cards.map((c,k)=>{const up=open.includes(k)||done.has(c.i);
    return `<button class="btn" data-k="${k}" style="min-height:64px;font-size:${c.en?14:15}px;background:${done.has(c.i)?'var(--mint)':up?'var(--paper)':'var(--plum)'};color:${up?'var(--night)':'var(--gold)'}">${up?esc(c.t):'?'}</button>`}).join('');
    $('#mboard').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>flip(+b.dataset.k))};
  const flip=async k=>{
    if(lock||open.includes(k)||done.has(cards[k].i))return;
    open.push(k);draw();if(open.length<2)return;
    moves++;$('#mmoves').textContent=`翻了 ${moves} 次`;
    const [a,b]=open;
    if(cards[a].i===cards[b].i&&cards[a].en!==cards[b].en){done.add(cards[a].i);open=[];draw();
      if(done.size===pairs.length){const score=Math.max(3,GAME_MAX-(moves-pairs.length));const r=await claimGame('match',score);
        modal(`<h2 style="text-align:center">全部配對完成！</h2><p style="text-align:center;margin:0">翻了 ${moves} 次・得分 ${score}</p><p style="text-align:center;margin:0;color:var(--gold)">${r?`+${r} 金幣`:'今天的翻牌金幣領滿了'}</p><div class="row"><button class="btn" data-close id="mhub">回遊戲區</button><button class="btn gold" data-close id="magain">再玩一次</button></div>`);
        $('#mhub').onclick=()=>go('games');$('#magain').onclick=gMatch}}
    else{lock=true;setTimeout(()=>{open=[];lock=false;draw()},800)}
  };
  draw();
}

        <div class="small">正解：${esc(q.o[keys[k]])}${ans[k]!==keys[k]?`・你選：${ans[k]>=0?esc(q.o[ans[k]]):'沒作答'}`:'・答對'}</div></div>`).join('')}
      <p class="small" style="margin:0">答錯的題目已經放進錯題本。</p>

/* ---------- 魔法盲盒 ----------
   機率公開、50 抽保底 SSR、十連保底 SR、每天最多 10 抽、重複的轉成金幣、答完今日一題每天免費抽一次。
   線上版由資料庫 gacha_pull() 抽（用資料庫的亂數），網頁只顯示結果。 */
const RARITY={N:['N','#c7b8e8',60,10],R:['R','#6ab0f3',28,25],SR:['SR','#b48cf0',10,80],SSR:['SSR','#ffd166',2,200]};
const GACHA_ONE=50,GACHA_TEN=450,GACHA_DAY=10,GACHA_PITY=50;
function gstate(){const g=S.gacha=S.gacha||{pity:0,day:'',pulls:0,free:'',tickets:0};g.tickets=g.tickets||0;if(g.day!==today()){g.day=today();g.pulls=0}return g}
const gachaFree=()=>gstate().free!==today()&&!!S.answers[dkey()];
function gachaLocal(n,free,ticket){
  const g=gstate(),out=[];let gotSR=false;
  if(ticket){g.tickets--}else if(free){g.free=today()}else{g.pulls+=n;S.tx=(S.tx||0)-(n===1?GACHA_ONE:GACHA_TEN)}
  for(let i=1;i<=n;i++){
    g.pity++;const r=Math.random();
    let rar=g.pity>=GACHA_PITY?'SSR':r<.02?'SSR':r<.12?'SR':r<.40?'R':'N';
    if(n===10&&i===10&&!gotSR&&(rar==='N'||rar==='R'))rar='SR';
    if(rar==='SR'||rar==='SSR')gotSR=true;if(rar==='SSR')g.pity=0;
    const l=SHOP.filter(x=>x.gacha===rar),it=l[Math.floor(Math.random()*l.length)],dup=S.owned[it.id]!=null,refund=dup?RARITY[rar][3]:0;

function bankLocalSettle(){
  const b=S.bank=S.bank||{balance:0,settled:today(),log:[]};
  const d=Math.min(30,Math.round((new Date(today()+'T00:00')-new Date(b.settled+'T00:00'))/864e5));
  let add=0;for(let i=0;i<d;i++){const x=Math.min(Math.floor(b.balance*BANK_RATE),BANK_DAY_MAX);b.balance+=x;add+=x}
  if(add)b.log.unshift({amount:add,kind:'interest',created_at:new Date().toISOString()});
  b.settled=today();b.log=b.log.slice(0,10);save();
}

const FOUNTAIN=[[9,5],[10,5],[9,6],[10,6]],NOTICE=[7,5],QUEST=[12,5];
const TREES=[[0,4],[5,5],[19,4],[0,13],[6,13],[12,13],[19,13],[18,7]];
const FLOWERS=[[2,4],[4,6],[6,7],[12,7],[14,8],[18,4],[3,13],[9,13],[15,13],[11,4],[8,7]];
let CITY=null,cityLoop=0,city=null;
function buildCity(){
  const g=[...Array(CH)].map(()=>Array(CW).fill('.'));
  for(let x=0;x<CW;x++){g[3][x]='=';g[12][x]='=';g[8][x]='='}
  for(let y=3;y<=12;y++){g[y][6]='=';g[y][13]='='}
  for(let y=4;y<=7;y++)for(let x=8;x<=11;x++)g[y][x]='=';

  TREES.forEach(([x,y])=>g[y][x]='T');
  FOUNTAIN.forEach(([x,y])=>g[y][x]='w');
  g[NOTICE[1]][NOTICE[0]]='N';g[QUEST[1]][QUEST[0]]='Q';
  BUILDINGS.forEach(b=>{for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)g[y][x]='B';g[b.door[1]][b.door[0]]='D'});
  return g;
}
const walk=(x,y)=>x>=0&&y>=0&&x<CW&&y<CH&&!'BTwNQ'.includes(CITY[y][x]);
const bAt=(x,y)=>BUILDINGS.find(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h);
const doorAt=(x,y)=>BUILDINGS.find(b=>b.door[0]===x&&b.door[1]===y);
function bfs(sx,sy,tx,ty){
  if(!walk(tx,ty))return null;
  const prev=new Map(),k=(x,y)=>y*CW+x,q=[[sx,sy]];prev.set(k(sx,sy),null);
  while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty)break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(walk(nx,ny)&&!prev.has(k(nx,ny))){prev.set(k(nx,ny),[x,y]);q.push([nx,ny])}}}
  if(!prev.has(k(tx,ty)))return null;
  const path=[];let c=[tx,ty];while(c&&!(c[0]===sx&&c[1]===sy)){path.unshift(c);c=prev.get(k(c[0],c[1]))}
  return path;
}
function mkWalker(x,y,extra){return{x,y,px:x*TS+8,py:y*TS+8,path:[],...extra}}
function stepWalker(w,dt,speed){
  if(!w.path.length)return false;
  const [tx,ty]=w.path[0],gx=tx*TS+8,gy=ty*TS+8,dx=gx-w.px,dy=gy-w.py,d=Math.hypot(dx,dy),mv=speed*dt;
  if(d<=mv){w.px=gx;w.py=gy;w.x=tx;w.y=ty;w.path.shift();return true}
  w.px+=dx/d*mv;w.py+=dy/d*mv;if(Math.abs(dx)>1)w.face=dx<0?-1:1;return false;
}

function cityTap(tx,ty){
  const me=city.me;
  const npc=city.npcs.find(n=>n.x===tx&&n.y===ty);
  if(npc){const talk=BOT_TALK[S.tier];city.bubbles.push({who:npc,txt:['嗨！','今天打卡了嗎？',talk[hash(npc.name+Date.now())%talk.length],'一起去讀書房吧'][Math.floor(Math.random()*4)],until:performance.now()+2500});return}
  const peer=Object.values(city.peers).find(p=>Math.round((p.px-8)/TS)===tx&&Math.round((p.py-8)/TS)===ty);
  if(peer){visitRoom(peer.name,peer.uid,peer.tier);return}
  if(tx===NOTICE[0]&&ty===NOTICE[1]){const p=bfs(me.x,me.y,NOTICE[0],NOTICE[1]+1);if(p){me.path=p;me.goal='notice';if(!p.length){me.goal=null;openNotice()}}return}
  if(tx===QUEST[0]&&ty===QUEST[1]){const p=bfs(me.x,me.y,QUEST[0],QUEST[1]+1);if(p){me.path=p;me.goal='quest';if(!p.length){me.goal=null;renderQuests()}}return}
  const b=bAt(tx,ty)||doorAt(tx,ty);
  if(b){const p=bfs(me.x,me.y,b.door[0],b.door[1]);if(p){me.path=p;me.goal=b.id;if(!p.length)enterBuilding(b)}return}
  const p=bfs(me.x,me.y,tx,ty);if(p){me.path=p;me.goal=null}
}
function cityTick(dt){
  const me=city.me;

    const k=[...city.keys].pop(),d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[k];
    if(d&&walk(me.x+d[0],me.y+d[1])){me.path=[[me.x+d[0],me.y+d[1]]];me.goal=null}
  }
  if(stepWalker(me,dt,72)){
    const door=doorAt(me.x,me.y);
    if(door&&me.armed&&(!me.path.length)){enterBuilding(door);return}
    if(!door)me.armed=true;
    if(!me.path.length&&me.goal==='notice'){me.goal=null;openNotice()}
    if(!me.path.length&&me.goal==='quest'){me.goal=null;renderQuests();return}
    if(!me.path.length&&me.goal){const b=BUILDINGS.find(x=>x.id===me.goal);me.goal=null;if(b&&doorAt(me.x,me.y)===b)enterBuilding(b)}
  }
  city.npcs.forEach(n=>{
    if(!n.path.length){n.wait-=dt;if(n.wait<=0){n.wait=2+Math.random()*4;
      for(let i=0;i<8;i++){const tx=n.x+Math.round(Math.random()*6-3),ty=n.y+Math.round(Math.random()*6-3);if(walk(tx,ty)&&!doorAt(tx,ty)){const p=bfs(n.x,n.y,tx,ty);if(p&&p.length<8){n.path=p;break}}}}}
    stepWalker(n,dt,40);
  });
  Object.values(city.peers).forEach(p=>{p.px+=(p.tx-p.px)*Math.min(1,dt*6);p.py+=(p.ty-p.py)*Math.min(1,dt*6)});

}

let cityChan=null,cityChanName='';
function joinCity(){
  if(!ONLINE||!ME||!S.tier)return;

  if(cityChan)sb.removeChannel(cityChan);cityChanName=name;

  cityChan.on('presence',{event:'sync'},()=>{
    const st=cityChan.presenceState(),seen={};
    Object.entries(st).forEach(([k,v])=>{if(k===ME||isBlocked(k))return;const d=v[v.length-1];seen[k]=1;
      const p=city&&city.peers[k];if(p){Object.assign(p,{tx:d.x,ty:d.y,name:d.name,tier:d.tier,outfit:d.outfit})}
      else if(city)city.peers[k]={uid:k,px:d.x,py:d.y,tx:d.x,ty:d.y,name:d.name,tier:d.tier,outfit:d.outfit}});
    if(city)Object.keys(city.peers).forEach(k=>{if(!seen[k])delete city.peers[k]});
    /* 有新同學進城：把自己的位置傳一次給他 */
    if(city&&Object.keys(seen).some(k=>!city.known||!city.known[k])){city.known=seen;city.lastX=null;city.sent=0}
  });
  cityChan.subscribe(st=>{if(st==='SUBSCRIBED')cityTrack()});

   <div class="bar"><button class="btn ghost" id="hback" style="padding:5px 10px;font-size:13px">← 城市</button><span>我的家</span>${coinChip()}</div>
   <div id="hroom" style="position:relative;cursor:pointer">${roomSVG(bg,null,'我的家')}
     <div id="hme" style="position:absolute;width:12.5%;left:20%;top:72%;transition:left .6s linear,top .6s linear">${avatarSVG(L.outfit,1).replace('width="8" height="8"','width="100%" height="100%"')}</div>
     ${petSvg?`<div id="hpet" style="position:absolute;width:12.5%;left:55%;top:78%;transition:left .9s linear,top .9s linear">${petSvg}</div>`:''}
   </div>
   <p class="small" style="margin:0">點地板走過去${petSvg?'，寵物會跟著你':''}。</p>
   <div class="row"><button class="btn gold" id="hdeco">布置房間</button><button class="btn" id="hwear">換裝</button></div>`;
  paintSprites($('#view'));
  $('#hback').onclick=()=>go('city');$('#hdeco').onclick=()=>renderShop('room','home');$('#hwear').onclick=()=>renderShop('wear','home');
  const room=$('#hroom'),me=$('#hme'),pt=$('#hpet');let cur={x:20,y:72};
  const moveTo=(x,y)=>{const d=Math.hypot(x-cur.x,y-cur.y),s=Math.max(.2,d/35);me.style.transition=`left ${s}s linear,top ${s}s linear`;
    me.firstElementChild.style.transform=x<cur.x?'scaleX(-1)':'';me.style.left=x+'%';me.style.top=y+'%';cur={x,y};
    if(pt)setTimeout(()=>{pt.style.left=Math.max(0,Math.min(87,x+(x>50?-12:12)))+'%';pt.style.top=Math.min(80,y+5)+'%'},350)};
  room.onclick=e=>{const r=room.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100-6,y=(e.clientY-r.top)/r.height*100-12;
    moveTo(Math.max(0,Math.min(87,x)),Math.max(58,Math.min(80,y)))};
}

/* ---------- 遊樂場：恐怖阿嬤（迷你版） ----------
   四個房間用上鎖的門隔開，答對題目才能開門；答錯阿嬤會變快。走到出口 E 就逃出去了。 */
const GRANNY_MAP=['#################','#P..#...#...#..E#','#.#.#.#.#.#.#.#.#','#.#.D.#.#.#.#.#.#','#...#.#.D.#.#...#','#.#.#.#.#.#.D.#.#','#.#.#...#...#.#.#','#G..#...#...#...#','#################'];
const GRANNY_TAUNT=['You can’t escape!','阿嬤來了～','單字背了沒？','Come back here!','不要跑！'];
function gGranny(){
  const M=GRANNY_MAP.map(r=>[...r]),GW=M[0].length,GH=M.length,TL=20;
  let P,G,E;M.forEach((r,y)=>r.forEach((c,x)=>{if(c==='P'){P=[x,y];r[x]='.'}if(c==='G'){G=[x,y];r[x]='.'}if(c==='E')E=[x,y]}));
  let speed=S.tier==='kid'?1100:850,wrong=0,q=null,door=null,over=false,t0=Date.now(),last=Date.now()+2500,bubble=null,loopId=0;
  gameShell('恐怖阿嬤（迷你版）',`<p class="small" style="margin:0">走到門口答對題目才能開門，快逃到綠色出口！答錯阿嬤會變快。</p>
    <canvas id="gcv" width="${GW*TL*2}" height="${GH*TL*2}" style="width:100%;image-rendering:pixelated;border:3px solid var(--ink);display:block"></canvas>
    <div id="gq"></div>
    <div style="display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center" id="gpad">
      <span></span><button class="btn" data-d="0,-1" aria-label="上">▲</button><span></span>
      <button class="btn" data-d="-1,0" aria-label="左">◀</button><span></span><button class="btn" data-d="1,0" aria-label="右">▶</button>
      <span></span><button class="btn" data-d="0,1" aria-label="下">▼</button><span></span></div>`);
  const myCv=$('#gcv'),alive=()=>!over&&$('#gcv')===myCv;
  const walk=(x,y,g)=>M[y]&&M[y][x]&&(M[y][x]==='.'||M[y][x]==='E'&&!g);
  const move=(dx,dy)=>{if(!alive()||q)return;const x=P[0]+dx,y=P[1]+dy;const c=M[y]&&M[y][x];
    if(c==='D'){door=[x,y];ask();return}
    if(walk(x,y)){P=[x,y];if(x===E[0]&&y===E[1])end(true)}};
  const ask=()=>{q=pick(pool().filter(z=>z.q.length<=110));
    $('#gq').innerHTML=`<div class="box paper" style="display:flex;flex-direction:column;gap:6px"><p class="lbl" style="margin:0">上鎖的門：答對才能打開</p>
      ${q.pic?`<div style="display:flex;justify-content:center"><span data-s="${q.pic}" data-z="5"></span></div>`:''}<div style="line-height:1.5">${esc(q.q)}</div>
      ${q.o.map((o,i)=>`<button class="btn opt" data-gi="${i}" style="padding:6px 10px">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div>`;
    paintSprites($('#gq'));
    $('#gq').querySelectorAll('[data-gi]').forEach(b=>b.onclick=()=>{
      if(+b.dataset.gi===q.a){M[door[1]][door[0]]='.';P=door;q=null;$('#gq').innerHTML='';toast('門打開了！')}
      else{addWrong(q);wrong++;speed=Math.max(380,speed-110);bubble={t:'阿嬤變快了！',until:Date.now()+1500};q=null;$('#gq').innerHTML='';toast('答錯了，阿嬤變快了！')}
      last=Date.now();
    });
  };
  const chase=()=>{/* 阿嬤往玩家走一步（只能走地板和打開的門） */
    const k=(x,y)=>y*GW+x,prev=new Map([[k(...G),null]]),qq=[G];
    while(qq.length){const [x,y]=qq.shift();if(x===P[0]&&y===P[1])break;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(walk(nx,ny,true)&&!prev.has(k(nx,ny))){prev.set(k(nx,ny),[x,y]);qq.push([nx,ny])}}}
    if(!prev.has(k(...P)))return;let c=P;while(prev.get(k(...c))&&(prev.get(k(...c))[0]!==G[0]||prev.get(k(...c))[1]!==G[1]))c=prev.get(k(...c));G=c;
    if(Math.random()<.08)bubble={t:pick(GRANNY_TAUNT),until:Date.now()+1400};
  };
  const end=async win=>{over=true;cancelAnimationFrame(loopId);
    const secs=Math.round((Date.now()-t0)/1000),score=win?Math.max(5,15-wrong*2-Math.floor(secs/30)):0,r=win?await claimGame('granny',score):0;
    modal(`<h2 style="text-align:center">${win?'逃出來了！':'被阿嬤抓到了…'}</h2><p style="text-align:center;margin:0">${win?`花了 ${secs} 秒・答錯 ${wrong} 題`:'再試一次，先背熟題目！'}</p>${win?`<p style="text-align:center;margin:0;color:var(--gold)">${r?`+${r} 金幣`:'今天的阿嬤金幣領滿了'}</p>`:''}<div class="row"><button class="btn" data-close id="ghub">回遊樂場</button><button class="btn gold" data-close id="gagain">再玩一次</button></div>`);
    $('#ghub').onclick=()=>go('games');$('#gagain').onclick=gGranny};
  $('#gpad').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const [dx,dy]=b.dataset.d.split(',').map(Number);move(dx,dy)});
  const key=e=>{if(!alive()){document.removeEventListener('keydown',key);return}const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}};
  document.addEventListener('keydown',key);
  const me=avatarGrid(myLook().outfit);
  const draw=()=>{const cv=$('#gcv');if(!cv)return;const c=cv.getContext('2d');c.setTransform(2,0,0,2,0,0);c.imageSmoothingEnabled=false;
    M.forEach((r,y)=>r.forEach((ch,x)=>{const X=x*TL,Y=y*TL;
      c.fillStyle=ch==='#'?'#3a2f55':'#8b5e3c';c.fillRect(X,Y,TL,TL);
      if(ch==='#'){c.fillStyle='#2b2140';c.fillRect(X,Y+9,TL,2);c.fillRect(X+(y%2?4:14),Y,2,9);c.fillRect(X+(y%2?14:4),Y+11,2,9)}
      else{c.fillStyle='#7a5232';c.fillRect(X,Y+TL-2,TL,2)}
      if(ch==='D'){c.fillStyle='#5a3d2b';c.fillRect(X+2,Y+1,TL-4,TL-2);c.fillStyle='#ffd166';c.fillRect(X+8,Y+8,4,5);c.fillRect(X+9,Y+6,2,2)}
      if(ch==='E'){c.fillStyle='#3f8f5a';c.fillRect(X+2,Y+1,TL-4,TL-2);c.fillStyle='#f4ecd8';c.fillRect(X+12,Y+10,2,2)}}));
    const spr=(g,pal,x,y)=>g.forEach((row,yy)=>[...row].forEach((ch,xx)=>{if(pal[ch]&&ch!=='.'){c.fillStyle=pal[ch];c.fillRect(x*TL+2+xx*2,y*TL+2+yy*2,2,2)}}));
    spr(me.g,me.pal,P[0],P[1]);spr(SPR.granny,PAL,G[0],G[1]);
    if(bubble&&bubble.until>Date.now()){c.font='8px "DotGothic16",sans-serif';const w=c.measureText(bubble.t).width+6,bx=Math.min(GW*TL-w-2,Math.max(2,G[0]*TL+10-w/2));c.fillStyle='#f4ecd8';c.fillRect(bx,G[1]*TL-12,w,11);c.fillStyle='#1a1026';c.fillText(bubble.t,bx+3,G[1]*TL-3)}
  };
  const tick=()=>{if(!alive())return;if(!q&&Date.now()-last>speed){last=Date.now();chase();if(G[0]===P[0]&&G[1]===P[1]){draw();end(false);return}}draw();loopId=requestAnimationFrame(tick)};
  bubble={t:'阿嬤三秒後出發！',until:Date.now()+2400};tick();
}

/* ---------- 遊樂場：單字守城 ----------
   怪物從右邊走向城堡，答對最前面那隻的題目就發射魔法消滅牠；有 3 隻碰到城堡就輸了。 */
function gTower(){
  const src=pool().filter(z=>z.q.length<=90),TOTAL=12,LEN=320;
  let mons=[],spawned=0,killed=0,hp=3,cur=null,over=false,lastSpawn=0,t0=performance.now(),bolts=[],loopId=0;
  const spd=S.tier==='kid'?9:13;
  gameShell('單字守城',`<div class="bar"><span id="thp"></span><span class="small" id="tcount"></span></div>
    <canvas id="tcv" width="${LEN*2}" height="180" style="width:100%;image-rendering:pixelated;border:3px solid var(--ink);display:block"></canvas>
    <div id="tq"></div>`);
  const myCv=$('#tcv'),alive=()=>!over&&$('#tcv')===myCv;
  const kinds=['slime','bat','ghost'];
  const spawn=()=>{mons.push({x:LEN-22,k:kinds[spawned%3],q:pick(src),y:[28,50,72][spawned%3]});spawned++};
  const front=()=>mons.slice().sort((a,b)=>a.x-b.x)[0];
  const showQ=()=>{const m=front();if(!m){$('#tq').innerHTML='<p class="small" style="text-align:center">下一波怪物來了…</p>';cur=null;return}
    if(cur===m)return;cur=m;const q=m.q;
    $('#tq').innerHTML=`<div class="box paper" style="display:flex;flex-direction:column;gap:6px"><p class="lbl" style="margin:0">答對就能打倒最前面的怪物</p>
      ${q.pic?`<div style="display:flex;justify-content:center"><span data-s="${q.pic}" data-z="5"></span></div>`:''}<div style="line-height:1.5">${esc(q.q)}</div>
      <div class="chips">${q.o.map((o,i)=>`<button class="chip" data-ti="${i}" style="font-size:14px;padding:8px 12px">${esc(o)}</button>`).join('')}</div></div>`;
    paintSprites($('#tq'));
    $('#tq').querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>{
      if(!alive()||cur!==m)return;
      if(+b.dataset.ti===q.a){bolts.push({x:40,y:m.y+8,m});mons=mons.filter(z=>z!==m);killed++;cur=null;hud();showQ()}
      else{addWrong(q);b.style.background='var(--coral)';b.style.color='var(--night)';m.x-=18;toast('答錯了，怪物衝過來了！')}
    });
  };
  const hud=()=>{$('#thp').innerHTML=`城堡 ${'<span data-s="heart" data-z="2" style="display:inline-block;vertical-align:middle"></span>'.repeat(hp)}`;paintSprites($('#thp'));$('#tcount').textContent=`打倒 ${killed}／${TOTAL}`};
  const end=async win=>{over=true;cancelAnimationFrame(loopId);const score=killed+hp,r=await claimGame('tower',score);
    modal(`<h2 style="text-align:center">${win?'守住城堡了！':'城堡被攻破了…'}</h2><p style="text-align:center;margin:0">打倒 ${killed} 隻怪物・城堡剩 ${hp} 顆心</p><p style="text-align:center;margin:0;color:var(--gold)">${r?`+${r} 金幣`:score?'今天的守城金幣領滿了':''}</p><div class="row"><button class="btn" data-close id="thub">回遊樂場</button><button class="btn gold" data-close id="tagain">再玩一次</button></div>`);
    $('#thub').onclick=()=>go('games');$('#tagain').onclick=gTower};
  const draw=()=>{const cv=$('#tcv');if(!cv)return;const c=cv.getContext('2d');c.setTransform(2,0,0,2,0,0);c.imageSmoothingEnabled=false;
    c.fillStyle='#1d2a5c';c.fillRect(0,0,LEN,90);c.fillStyle='#3f8f5a';c.fillRect(0,40,LEN,50);c.fillStyle='#c9b98f';c.fillRect(30,44,LEN,40);
    for(let i=0;i<14;i++){c.fillStyle='#ffd166';c.fillRect((i*47)%LEN,(i*13)%34,1,1)}
    /* 城堡 */
    c.fillStyle='#9aa3b5';c.fillRect(2,18,34,70);for(let i=0;i<4;i++)c.fillRect(2+i*9,12,6,6);c.fillStyle='#5a3d2b';c.fillRect(13,62,12,26);c.fillStyle='#7a3f9e';c.fillRect(18,2,2,10);c.fillRect(20,2,8,5);
    const spr=(g,pal,x,y,z)=>g.forEach((row,yy)=>[...row].forEach((ch,xx)=>{if(pal[ch]&&ch!=='.'){c.fillStyle=pal[ch];c.fillRect(x+xx*z,y+yy*z,z,z)}}));
    const me=avatarGrid(myLook().outfit);spr(me.g,me.pal,38,58,2);
    mons.forEach(m=>{spr(SPR[m.k],PAL,Math.round(m.x),m.y+Math.round(Math.sin(performance.now()/200+m.y)*2),2);if(m===cur){c.fillStyle='#ffd166';c.fillRect(Math.round(m.x)+6,m.y-6,4,4)}});
    bolts.forEach(b=>{c.fillStyle='#9fe1cb';c.fillRect(b.x,b.y,6,3);c.fillStyle='#f4ecd8';c.fillRect(b.x+4,b.y,2,3)});
  };
  let prev=performance.now();
  const tick=t=>{if(!alive())return;const dt=Math.min(.05,(t-prev)/1000);prev=t;
    if(spawned<TOTAL&&(t-lastSpawn>(S.tier==='kid'?6000:4500)||!mons.length)&&t-t0>800){spawn();lastSpawn=t;showQ()}
    mons.forEach(m=>m.x-=spd*dt);
    mons.filter(m=>m.x<36).forEach(m=>{hp--;mons=mons.filter(z=>z!==m);if(cur===m){cur=null}toast('怪物打到城堡了！');hud();showQ()});
    bolts.forEach(b=>b.x+=260*dt);bolts=bolts.filter(b=>b.x<LEN);
    draw();
    if(hp<=0){end(false);return}
    if(spawned>=TOTAL&&!mons.length){end(true);return}
    loopId=requestAnimationFrame(tick)};
  hud();loopId=requestAnimationFrame(tick);
}

/* ---------- 魔法餐廳：每天來吃飯＝打卡 ----------
   飽足度 3 顆心：今天吃過 3 顆，每少吃一天少 1 顆；連續 3 天沒吃就餓倒變成小幽靈，
   要答對 3 題（免費）或付 100 金幣吃大餐才能復活。倒下時遊樂場和百貨公司暫停開放。 */
const FOODS=[['bento','營養午餐',0,'每天都有，免費！'],['noodles','牛肉麵',20,'湯頭好香'],['tea','珍珠奶茶',15,'Q 彈珍珠'],['pizza','披薩',30,'起司牽絲'],['sushi','壽司',35,'新鮮鮭魚'],['cake','草莓蛋糕',40,'甜甜的獎勵']];
const REVIVE_COST=100,REVIVE_NEED=3;
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
function lastMeal(){const k=Object.keys(S.meals||{}).sort().pop();if(!S.joined){S.joined=today();save()}return k&&k>S.joined?k:S.joined}
function hearts(){return Math.max(0,3-dayDiff(lastMeal(),today()))}
const fainted=()=>!!S.tier&&hearts()===0;
function heartChip(){const h=hearts();return h?`<span style="display:inline-flex;align-items:center;gap:1px" aria-label="飽足度 ${h} 顆心">${'<span data-s="heart" data-z="2"></span>'.repeat(h)}</span>`:'<span style="color:var(--lilac)">餓倒了</span>'}
function needFood(){
  if(!fainted())return false;
  const m=modal(`<div style="display:flex;justify-content:center"><span data-s="ghost" data-z="8"></span></div><h2 style="text-align:center">你餓倒了！</h2>
    <p style="text-align:center;margin:0;line-height:1.6">已經連續三天沒來吃飯，變成小幽靈了。<br>先到魔法餐廳復活，才能去遊樂場和百貨公司。</p>
    <button class="btn gold" id="gofood">去餐廳</button>`);
  m.querySelector('#gofood').onclick=()=>{m.remove();renderFood()};return true;
}
async function eat(food){
  const f=FOODS.find(x=>x[0]===food)||[food,food==='revive_pay'?'復活大餐':'復活',food==='revive_pay'?REVIVE_COST:0];
  if(f[2]>coins()){toast('金幣不夠');return false}
  if(ONLINE){const r=await cloud.rpc('eat',{p_food:food});if(!r)return false;syncWallet(r.wallet)}else if(f[2])S.tx=(S.tx||0)-f[2];
  S.meals[today()]=food;save();return true;
}
function renderFood(){
  curTab='food';$('#app').classList.remove('wide');
  $('#nav').querySelectorAll('button').forEach(b=>b.setAttribute('aria-current','false'));
  const ate=S.meals[today()],h=hearts(),dead=h===0;
  $('#view').innerHTML=`<div class="bar"><button class="btn ghost" id="fback" style="padding:5px 10px;font-size:13px">← 城市</button><span>魔法餐廳</span>${coinChip()}</div>
    <div class="box" style="background:var(--deep);display:flex;gap:14px;align-items:center">
      ${dead?'<span data-s="ghost" data-z="7"></span>':avatarSVG(myLook().outfit,7)}
      <div><div style="font-size:16px">飽足度 ${heartChip()}</div>
      <div class="small" style="line-height:1.6">${dead?'你餓倒了，快復活！':ate?'今天吃飽了，明天再來喔':h===1?'肚子好餓…今天再不吃就會餓倒！':'今天還沒吃飯'}</div></div></div>
    <div id="fbody"></div>
    <p class="demo" style="text-align:left;line-height:1.6">每天來吃一次飯就算打卡。每少吃一天少一顆心，連續三天沒吃會餓倒。</p>`;
  paintSprites($('#view'));
  $('#fback').onclick=()=>go('city');
  const body=$('#fbody');
  if(dead){
    body.innerHTML=`<div class="flist"><button class="frow" id="rquiz" style="padding:12px"><span data-s="book" data-z="4"></span><span class="grow"><span style="font-size:16px">答對 ${REVIVE_NEED} 題復活</span><br><span class="small">免費，用你的題目範圍出題</span></span></button>
      <button class="frow" id="rpay" style="padding:12px"><span data-s="feast" data-z="4"></span><span class="grow"><span style="font-size:16px">吃一頓復活大餐</span><br><span class="small">${REVIVE_COST} 金幣，馬上復活</span></span></button></div><div id="rq"></div>`;
    paintSprites(body);
    $('#rpay').onclick=async()=>{if(await eat('revive_pay')){toast('復活了！以後記得每天來吃飯');renderFood()}};
    $('#rquiz').onclick=()=>{let ok=0;const ask=()=>{const q=pick(pool().filter(z=>z.q.length<=110));
      $('#rq').innerHTML=`<div class="box paper" style="display:flex;flex-direction:column;gap:6px"><p class="lbl" style="margin:0">復活挑戰：答對 ${ok}／${REVIVE_NEED}</p>
        ${q.pic?`<div style="display:flex;justify-content:center"><span data-s="${q.pic}" data-z="5"></span></div>`:''}<div style="line-height:1.5">${esc(q.q)}</div>
        ${q.o.map((o,i)=>`<button class="btn opt" data-ri="${i}" style="padding:6px 10px">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div>`;
      paintSprites($('#rq'));$('#rq').scrollIntoView({block:'nearest'});
      $('#rq').querySelectorAll('[data-ri]').forEach(b=>b.onclick=async()=>{
        if(+b.dataset.ri===q.a){ok++;if(ok>=REVIVE_NEED){if(await eat('revive_quiz')){toast('復活了！以後記得每天來吃飯');renderFood()}return}toast(`答對了！還差 ${REVIVE_NEED-ok} 題`)}
        else{addWrong(q);toast(`答案是 ${q.o[q.a]}`)}
        ask()})};ask()};

    if(pu){S.owned={};pu.forEach(r=>S.owned[r.item_id]=r.price)}

    if(wl)S.tx=wl.tx||0;
    if(ml){S.meals={};ml.forEach(r=>S.meals[r.day]=r.food)}
    if(p){S.name=p.name;S.tier=p.tier;S.cls=p.class_code||'';S.joined=keyOf(new Date(p.created_at))}else{S.name='';S.tier='';S.joined=today()}
    S.days={};S.minutes={};S.answers={};S.cards={};
    a.forEach(r=>{S.days[r.day]=true;S.answers[r.day+':'+r.tier]={c:r.choice,ok:r.correct,qid:r.qid}});
    f.forEach(r=>{S.days[r.day]=true;S.minutes[r.day]=(S.minutes[r.day]||0)+r.minutes});
    c.forEach(r=>S.cards[r.word]={zh:r.zh,n:r.n});
    S.blocked=S.blocked.filter(x=>!x.startsWith('u:')).concat(b.map(r=>`u:${r.blocked_id}:${(r.profiles&&r.profiles.name)||'同學'}`));
    save();return true;
  }
};

  const t=T(),talk=BOT_TALK[S.tier],base=hash(today()+S.tier);

  if(!ONLINE){
    (S.comments[dkey()]||[]).forEach(c=>list.push({who:S.name,txt:c,me:true}));
    $('#stat').textContent=`全國${t.stage}生 ${(600+hash(today()+S.tier)%900).toLocaleString()} 人作答・答對率 ${48+hash(S.tier+today())%30}%`;
  }else{
    const [st,cs]=await Promise.all([cloud.stats(q),cloud.comments(q.id)]);

    $('#stat').textContent=st?`今天 ${st.total} 位${t.stage}生作答・答對率 ${st.total?Math.round(100*st.correct/st.total):0}%`:'統計暫時載不到';
    (cs||[]).filter(c=>!isBlocked(c.user_id)).forEach(c=>list.push({who:(c.profiles&&c.profiles.name)||'同學',txt:c.body,me:c.user_id===ME,id:c.id,uid:c.user_id}));
  }
  $('#cmts').innerHTML=list.map((c,i)=>`

function saveTimer(){S.timer=tm.mode==='idle'?null:{mode:tm.mode,end:tm.end,len:tm.len,left:tm.left,paused:!!tm.paused,speed:tm.speed};save()}
function restoreTimer(){
  const t=S.timer;if(!t||tm.mode!=='idle')return;

    Object.keys(botMin).forEach(k=>{if(Math.random()<.02*tm.speed/10)botMin[k]++});

/* 送禮物：金幣（10–100，每天最多送 200）或商店裡要付費的東西，資料庫會再檢查一次 */
function giftModal(uid,name){
  let kind='coins',amt=30,item=null;
  const m=modal(`<h2>送禮物給 ${esc(name)}</h2>
    <div class="chips"><button class="chip" data-gk="coins" aria-pressed="true">金幣</button><button class="chip" data-gk="item" aria-pressed="false">禮物</button></div>
    <div id="gbody"></div>
    <label for="gnote" class="small">留一句話（30 字內，可以不填）</label>
    <input type="text" id="gnote" maxlength="30" placeholder="生日快樂！">
    <p class="err" id="gerr" role="alert"></p>
    <div class="row"><button class="btn" data-close>取消</button><button class="btn gold" id="gsend">送出</button></div>`);
  const body=()=>{
    const g=m.querySelector('#gbody');
    if(kind==='coins'){g.innerHTML=`<div class="chips">${[10,30,50,100].map(v=>`<button class="chip" data-ga="${v}" aria-pressed="${v===amt}">${v} 金幣</button>`).join('')}</div><p class="small" style="margin:6px 0 0">你有 ${coins().toLocaleString()} 金幣・每天最多送出 200</p>`;
      g.querySelectorAll('[data-ga]').forEach(b=>b.onclick=()=>{amt=+b.dataset.ga;body()})}
    else{g.innerHTML=`<div class="shop" style="max-height:260px;overflow-y:auto">${SHOP.filter(x=>x.price>0&&buyable(x)).map(x=>`<button class="sitem${item===x.id?' on':''}" data-gi="${x.id}" type="button">${itemThumb(x)}<span>${esc(x.name)}</span><span class="price"><span data-s="coin" data-z="2"></span>${x.price}</span></button>`).join('')}</div>`;
      paintSprites(g);g.querySelectorAll('[data-gi]').forEach(b=>b.onclick=()=>{item=b.dataset.gi;m.querySelector('#gerr').textContent='';body()})}
  };
  m.querySelectorAll('[data-gk]').forEach(b=>b.onclick=()=>{kind=b.dataset.gk;m.querySelectorAll('[data-gk]').forEach(x=>x.setAttribute('aria-pressed',x===b));body()});
  body();
  m.querySelector('#gsend').onclick=async()=>{
    const err=m.querySelector('#gerr'),note=clean(m.querySelector('#gnote').value.trim());
    if(kind==='item'&&!item){err.textContent='先選一個禮物';return}
    const price=kind==='coins'?amt:ITEM[item].price;
    if(price>coins()){err.textContent='金幣不夠';return}
    if(!ONLINE){err.textContent='登入網頁版才能送禮物';return}
    const b=m.querySelector('#gsend');b.disabled=true;b.textContent='送出中…';
    const r=await cloud.rpc('send_gift',{p_to:uid,p_kind:kind,p_amount:kind==='coins'?amt:null,p_item:kind==='item'?item:null,p_note:note});
    if(!r){b.disabled=false;b.textContent='送出';return}
    syncWallet(r.wallet);m.remove();
    const label=kind==='coins'?`${amt} 金幣`:ITEM[item].name;
    toast(`已經送出 ${label}`);
    const msg=await cloud.send(uid,`（送了你一份禮物：${label}）${note?' '+note:''}`.slice(0,200));
    if(msg&&chatWith&&chatWith.uid===uid){chatWith.msgs.push(msg);drawChat()}
  };
}
function drawChat(){
  const box=$('#chat');if(!box||!chatWith)return;
  const tm2=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
  box.innerHTML=chatWith.msgs.length?chatWith.msgs.map((m,i)=>m.sender===ME
    ?`<div class="bub me">${esc(m.body)}<time>${tm2(m.created_at)}</time></div>`
    :`<div class="bub them">${esc(m.body)}<time>${tm2(m.created_at)}・<button class="more" data-rm="${i}" style="font-size:11px;padding:0;color:var(--plum)">檢舉</button></time></div>`).join('')
    :`<p class="small" style="margin:auto;text-align:center">跟 ${esc(chatWith.name)} 打聲招呼吧</p>`;
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const m=chatWith.msgs[+b.dataset.rm];cloud.reportMsg(m.id);b.textContent='已檢舉';b.disabled=true;toast('已檢舉，老師會處理')});
  box.lastElementChild&&box.lastElementChild.scrollIntoView({block:'end'});
}

const MKINDS={answer_days:['答今日一題','天'],checkin_days:['打卡','天'],meal_days:['去餐廳吃飯','天'],focus_minutes:['在讀書房專注','分鐘'],challenge_wins:['雙倍挑戰贏','次']};
async function tMission(){
  const rows=await cloud.teacher('my_missions');if(curTab!=='teacher'||!$('#tbody'))return;
  const sel=(id,opts)=>`<select id="${id}" style="font-family:inherit;font-size:14px;padding:8px;border:3px solid var(--ink);border-radius:0;background:var(--paper);color:var(--night)">${opts}</select>`;
  $('#tbody').innerHTML=`<div class="box" style="background:var(--deep);display:flex;flex-direction:column;gap:8px">
     <h2>出任務</h2><label class="small" for="tcls2">給</label>${classPick()}

     <p class="small" style="margin:0">從今天開始算，期限內累積達到目標，學生就能在任務板領獎。</p>
     <p class="err" id="merr2"></p><button class="btn gold" id="mpost">發布任務</button></div>
   <h2>我出的任務</h2>${(rows||[]).map(m=>`<div class="titem"><div class="bar"><span>${esc(m.title)}</span><span class="small">${m.class_code?esc(m.class_code):'全部年級'}・到 ${tday(m.end_day)}</span></div><div class="small">${MKINDS[m.kind][0]} ${m.target} ${MKINDS[m.kind][1]}・獎勵 ${m.reward} 金幣・已有 ${m.claims} 人完成</div><div class="acts"><button class="btn ghost" data-mdel="${m.id}">刪除</button></div></div>`).join('')||'<p class="small">還沒有任務。</p>'}`;
  $('#mpost').onclick=async()=>{const n=id=>+$('#'+id).value.trim(),t=$('#mtitle').value.trim(),err=$('#merr2');

    if(!(n('mdays')>=1&&n('mdays')<=60)){err.textContent='期限要在 1 到 60 天之間';return}

async function tReports(){

  $('#tbody').innerHTML=`
   <h2>被檢舉的留言（${cs.length}）</h2>
   ${cs.length?cs.map(c=>`<div class="titem">

   </div>`).join(''):'<p class="small">目前沒有被檢舉的留言。</p>'}
   <h2>被檢舉的私訊（${ms.length}）</h2>
   ${ms.length?ms.map(m=>`<div class="titem">
     <div class="bar"><span>${esc(m.sender)} → ${esc(m.recipient)} <span class="small">${m.class_code?esc(m.class_code)+'・':''}${when(m.created_at)}</span></span><span class="pill bad">${m.reports} 人檢舉</span></div>
     <div style="line-height:1.6">${esc(m.body)}</div>
     <div class="acts"><button class="btn coral" data-dm="${m.message_id}">刪除這則私訊</button><button class="btn ghost" data-dmm="${m.message_id}">沒問題，撤銷檢舉</button><button class="btn ghost" data-mute="${m.sender_id}" data-name="${esc(m.sender)}">禁言 ${esc(m.sender)}</button></div>
   </div>`).join(''):'<p class="small">目前沒有被檢舉的私訊。</p>'}`;
  const act=async(fn,args,msg)=>{if(await cloud.teacher(fn,args)!==undefined){toast(msg);tReports()}};
  $('#tbody').querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>act('teacher_hide_comment',{p_id:+b.dataset.hide,p_hidden:b.dataset.v==='1'},b.dataset.v==='1'?'已隱藏':'已恢復顯示'));
  $('#tbody').querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>act('teacher_dismiss_comment',{p_id:+b.dataset.dc},'已撤銷檢舉'));
  $('#tbody').querySelectorAll('[data-dmm]').forEach(b=>b.onclick=()=>act('teacher_dismiss_message',{p_id:+b.dataset.dmm},'已撤銷檢舉'));

  $('#tbody').querySelectorAll('[data-mute]').forEach(b=>b.onclick=()=>{const m=modal(`<h2>禁言 ${esc(b.dataset.name)}？</h2><p class="small">禁言後不能留言和傳私訊，可以在「班級總覽」解除。</p><div class="row"><button class="btn" data-close>取消</button><button class="btn coral" id="yes">禁言</button></div>`);m.querySelector('#yes').onclick=()=>{m.remove();act('teacher_set_muted',{p_user:b.dataset.mute,p_muted:true},`已禁言 ${b.dataset.name}`)}});

function renderMe(){
  const t=T(),d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
  let cal=['日','一','二','三','四','五','六'].map(w=>`<div class="wk">${w}</div>`).join('')+'<div class="wk"></div>'.repeat(first);
  for(let i=1;i<=last;i++){const k=`${y}-${pad(m+1)}-${pad(i)}`;cal+=`<div class="${S.days[k]?'on':''} ${i===d.getDate()?'today':''}">${i}</div>`}
  const cards=Object.entries(S.cards);
  $('#view').innerHTML=`
   <div style="display:flex;gap:12px;align-items:center">${avatarSVG(myLook().outfit,7)}
     <div style="flex:1"><h2>${t.name} ${esc(S.name)}</h2><div class="small">${t.stage}${S.cls&&S.cls!==t.stage?'・'+esc(S.cls):''}</div></div>${coinChip()}</div>
   <button id="myroom" style="padding:0;border:0;background:none;cursor:pointer" aria-label="布置我的房間">${roomSVG(myLook(),myLook().outfit,'我的房間')}</button>
   <div class="row"><button class="btn gold" id="deco">布置房間</button><button class="btn" id="wear">換裝</button></div>
   <div class="box stats" style="background:var(--deep)">
     <div><b>${streak()}</b><span class="small">連續天數</span></div>
     <div><b>${(weekMinutes()/60).toFixed(1)}</b><span class="small">本週小時</span></div>
     <div><b>${cards.length}</b><span class="small">單字卡</span></div>
   </div>
   <div class="box" style="background:var(--deep)"><p class="small" style="margin:0 0 8px">${m+1} 月打卡</p><div class="cal">${cal}</div></div>
   <div class="box" style="background:var(--deep)"><p class="small" style="margin:0 0 8px">我的單字卡${(()=>{const n=cards.length,nx=SHOP.filter(i=>i.cards&&n<i.cards).sort((a,b)=>a.cards-b.cards)[0];return nx?`・再收集 ${nx.cards-n} 張解鎖「${nx.name}」`:'・獎勵全部解鎖了！'})()}</p>
     ${cards.length?`<div class="cards">${cards.map(([w,c])=>`<div class="card"><div style="font-size:14px">${esc(w)}</div><div style="color:var(--plum)">${esc(c.zh)}</div>${c.n>1?`<div>×${c.n}</div>`:''}</div>`).join('')}</div>`
      :`<p style="margin:0">答對今日一題或完成一次專注，就能收集第一張卡。</p>`}
   </div>
   ${SRCS[S.tier]?`<div class="box" style="background:var(--deep);display:flex;flex-direction:column;gap:8px">
     <label for="scope" class="small">題目範圍（今日一題、多練幾題、小遊戲、雙倍挑戰都用這個）</label>
     ${scopeSelect()}
     <p class="small" style="margin:0">目前：${esc(scopeName())}・${pool().length.toLocaleString()} 題。</p>
   </div>`:''}

   ${reminderBox()}
   ${TEACHER?'<button class="btn mint" id="tdash">老師後台</button>':''}

   ${S.blocked.length?`<p class="small">已封鎖：${S.blocked.map(b=>esc(b.startsWith('u:')?b.split(':').slice(2).join(':'):b)).join('、')} <button class="chip" id="unb">全部解除</button></p>`:''}`;

async function share(){
  try{await document.fonts.load('20px DotGothic16')}catch(e){}
  const W=540,H=960,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  const F=s=>`${s}px DotGothic16, "PingFang TC", sans-serif`;
  x.fillStyle='#2b2140';x.fillRect(0,0,W,H);
  x.fillStyle='#1d1630';for(let i=0;i<40;i++)x.fillRect(hash('s'+i)%W,hash('t'+i)%H,4,4);
  x.strokeStyle='#0f0a1a';x.lineWidth=12;x.strokeRect(6,6,W-12,H-12);x.strokeStyle='#f4ecd8';x.lineWidth=4;x.strokeRect(20,20,W-40,H-40);
  x.textAlign='center';x.fillStyle='#ffd166';x.font=F(44);x.fillText('LEARNING DEN',W/2,110);
  const d=new Date();x.fillStyle='#c7b8e8';x.font=F(24);x.fillText(`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`,W/2,155);
  const m=SPR[S.tier],z=20,ox=W/2-80;m.forEach((row,yy)=>[...row].forEach((ch,xx)=>{if(PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(ox+xx*z,200+yy*z,z,z)}}));
  x.fillStyle='#f4ecd8';x.font=F(34);x.fillText(`${T().name} ${S.name}`,W/2,420);
  const rows=[['連續打卡',`${streak()} 天`],['今天專注',`${S.minutes[today()]||0} 分鐘`],['今日一題',S.answers[dkey()]?(S.answers[dkey()].ok?'答對':'已作答'):'還沒答'],['單字卡',`${Object.keys(S.cards).length} 張`]];
  rows.forEach((r,i)=>{const yy=490+i*90;x.fillStyle='#1d1630';x.fillRect(60,yy,W-120,70);x.textAlign='left';x.fillStyle='#c7b8e8';x.font=F(26);x.fillText(r[0],85,yy+46);x.textAlign='right';x.fillStyle='#ffd166';x.font=F(32);x.fillText(r[1],W-85,yy+47)});
  x.textAlign='center';x.fillStyle='#9fe1cb';x.font=F(24);x.fillText('陪你一起讀書啦',W/2,890);
  const url=c.toDataURL('image/png');
  modal(`<h2>分享圖</h2><img src="${url}" alt="今天的學習成果分享圖" style="width:100%;border:3px solid var(--ink)"><p class="small" style="margin:0">手機長按圖片即可儲存，再貼到 IG 限動。</p><button class="btn" data-close>關閉</button>`);
}
